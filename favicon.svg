      <stop offset="0" stop-color="#0d2439"/>
      <stop offset=".45" stop-color="#071524"/>
      <stop offset="1" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="pinkHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff67d8" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#ff2bb8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ff2bb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="50%" r="50%">
