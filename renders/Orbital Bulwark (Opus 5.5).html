<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Orbital Bulwark (Copy)</title>
<style>
:root{
  --ink:#eaffff;--muted:#6f8da3;--dim:#405a6d;--cyan:#75f4ff;--cyan-soft:#2baac7;
  --mint:#8dffc4;--green:#46e69a;--pink:#ff67d8;--amber:#ffd166;--red:#ff5f73;
  --white:#ffffff;--black:#02040a;--line:#26364e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;color:var(--ink);
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,ui-monospace,monospace;
  background:
    radial-gradient(circle at 50% 10%,rgba(22,67,89,.38),transparent 55%),
    radial-gradient(circle at 12% 100%,rgba(84,22,71,.22),transparent 50%),
    radial-gradient(circle at 94% 78%,rgba(18,59,78,.2),transparent 45%),
    #03050a;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(118,235,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(118,235,255,.025) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;
  background-image:
    radial-gradient(1px 1px at 8% 14%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 72%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 35% 28%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 47% 88%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 61% 9%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 73% 56%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 86% 33%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 93% 81%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 4% 48%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 44%,#fff 50%,transparent 51%);
}
.cabinet{
  position:relative;z-index:1;
  width:min(820px,94vw,calc((100dvh - 156px) * 7 / 8));
  padding:22px;border:1px solid #26364e;border-radius:22px;
  background:linear-gradient(180deg,#0c1724 0%,#070d16 55%,#04070d 100%);
  box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(160,220,255,.14),0 0 46px rgba(60,180,220,.09);
}
.frame{
  padding:10px;border-radius:14px;background:#03070d;
  box-shadow:inset 0 2px 12px rgba(0,0,0,.85),inset 0 0 0 1px rgba(117,244,255,.06);
}
.screen{position:relative;overflow:hidden;aspect-ratio:7/8;border-radius:10px;background:#02040a}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;outline:none}
.fx{position:absolute;inset:0;pointer-events:none;border-radius:10px}
.scan{background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.6) 2px,rgba(0,0,0,.6) 3px);opacity:.7;mix-blend-mode:multiply}
.glare{
  background:linear-gradient(120deg,transparent 0%,transparent 42%,rgba(255,255,255,.055) 50%,transparent 58%,transparent 100%);
  background-size:260% 260%;animation:glare 12s linear infinite;
}
@keyframes glare{0%{background-position:120% 0}100%{background-position:-160% 0}}
.vig{background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%);box-shadow:inset 0 0 90px rgba(0,0,0,.7),inset 0 0 24px rgba(0,0,0,.55)}
.edge{box-shadow:inset 0 0 0 1px rgba(117,244,255,.15)}
.deck{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.hints{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);letter-spacing:.08em}
.hints span{white-space:nowrap}
kbd{display:inline-block;min-width:20px;text-align:center;padding:2px 5px;margin-right:4px;border:1px solid #2a3c52;border-bottom-width:2px;border-radius:4px;background:#0a1420;color:var(--ink);font:inherit;font-size:10px}
.btns{display:flex;gap:8px;margin-left:auto}
.dbtn{
  min-height:30px;padding:0 12px;border-radius:8px;border:1px solid #26364e;
  background:linear-gradient(#0d1a28,#08111b);color:var(--cyan);font:inherit;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
}
.dbtn[aria-pressed="false"]#btnSound{color:var(--muted)}
.dbtn:disabled{opacity:.4;cursor:default}
.dbtn:focus-visible,.tbtn:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.touch{display:none}
.tbtn{
  height:48px;border-radius:10px;border:1px solid #26364e;color:var(--cyan);font:inherit;font-size:16px;
  background:linear-gradient(#0f1d2c,#08111b);touch-action:none;-webkit-user-select:none;user-select:none;
  letter-spacing:.14em;
}
.tbtn.fire{color:var(--pink);border-color:#4a2a48}
.tbtn:active{background:linear-gradient(#173048,#0b1824)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (pointer:coarse){
  .cabinet{width:min(calc(100vw - 16px),760px,calc((100dvh - 158px) * 7 / 8));padding:12px;border-radius:18px}
  .hints{display:none}
  .touch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .tleft{display:flex;gap:10px}
  .tleft .tbtn{flex:1}
  .deck{margin-top:10px}
}
@media (pointer:coarse) and (max-height:500px){
  .tbtn{height:40px}
  .dbtn{min-height:26px}
}
@media (prefers-reduced-motion:reduce){
  .scan{opacity:.35}
  .glare{animation:none}
}
</style>
</head>
<body>
<main class="cabinet" aria-label="Orbital Bulwark arcade cabinet">
  <div class="frame">
    <div class="screen">
      <canvas id="game" tabindex="0" role="application"
        aria-label="Orbital Bulwark, an arcade shooter. Arrow keys or A and D move, Space fires, Enter starts, P pauses, M toggles sound, I opens system info."
        aria-keyshortcuts="ArrowLeft ArrowRight A D Space Enter P Escape M I R Y N Q"></canvas>
      <div class="fx scan"></div>
      <div class="fx glare"></div>
      <div class="fx vig"></div>
      <div class="fx edge"></div>
    </div>
  </div>
  <div class="touch" aria-label="Touch controls">
    <div class="tleft">
      <button class="tbtn" id="tLeft" type="button" aria-label="Move left">&#x25C0;&#xFE0E;</button>
      <button class="tbtn" id="tRight" type="button" aria-label="Move right">&#x25B6;&#xFE0E;</button>
    </div>
    <button class="tbtn fire" id="tFire" type="button" aria-label="Fire">FIRE</button>
  </div>
  <div class="deck">
    <div class="hints" aria-hidden="true">
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd>Move</span>
      <span><kbd>Space</kbd>Fire</span>
      <span><kbd>P</kbd>Pause</span>
      <span><kbd>M</kbd>Sound</span>
    </div>
    <div class="btns">
      <button class="dbtn" id="btnSound" type="button" aria-pressed="true" aria-label="Toggle sound">Sound on</button>
      <button class="dbtn" id="btnPause" type="button" aria-pressed="false" aria-label="Pause or resume">Pause</button>
    </div>
  </div>
</main>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* ---------- identity & constants ---------- */
const W = 630, H = 720, RS = 2;
const GROUND_Y = 678, DANGER_Y = 574, UFO_DEFLECTOR_CHANCE = .1;
const GAME_NAME = 'orbital-bulwark';
const GAME_HASH = '7c2e9a';
const GAME_ID = `${GAME_NAME}-${GAME_HASH}`;
const storeKey = name => `si.${GAME_ID}.${name}`;
const KEY_HI = storeKey('hi'), KEY_SOUND = storeKey('sound');

const C = {
  ink:'#eaffff', muted:'#6f8da3', dim:'#405a6d',
  cyan:'#75f4ff', cyanSoft:'#2baac7',
  mint:'#8dffc4', green:'#46e69a', greenGlow:'#25ff9c',
  pink:'#ff67d8', pinkGlow:'#ff2bb8',
  amber:'#ffd166', amberGlow:'#ff9d25',
  red:'#ff5f73', redGlow:'#ff2348',
  white:'#ffffff', black:'#02040a'
};

const canvas = document.getElementById('game');
canvas.width = W * RS; canvas.height = H * RS;
const ctx = canvas.getContext('2d');
ctx.scale(RS, RS);
ctx.imageSmoothingEnabled = false;
const live = document.getElementById('live');
const btnSound = document.getElementById('btnSound');
const btnPause = document.getElementById('btnPause');
const tLeft = document.getElementById('tLeft');
const tRight = document.getElementById('tRight');
const tFire = document.getElementById('tFire');

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pad = (n, l) => String(Math.max(0, Math.floor(n))).padStart(l, '0');
const inRect = (p, r) => !!p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function hexA(h, a){ const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

const mqRM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let RM = !!(mqRM && mqRM.matches);
if (mqRM){
  const f = () => { RM = mqRM.matches; };
  if (mqRM.addEventListener) mqRM.addEventListener('change', f); else if (mqRM.addListener) mqRM.addListener(f);
}

/* ---------- storage (only two keys) ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { window.localStorage.setItem(k, v); } catch (e) {} }
function storedHiScore(){ const v = parseInt(lsGet(KEY_HI), 10); return Number.isFinite(v) && v > 0 ? v : 0; }
function saveHi(){ if (game.hiScore > storedHiScore()) lsSet(KEY_HI, String(game.hiScore)); }

/* ---------- build stamp ---------- */
function fnv1a(s){
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7);
}
const BUILD_HASH = fnv1a(
  Array.from(document.querySelectorAll('style')).map(n => n.textContent).join('') +
  Array.from(document.querySelectorAll('script')).map(n => n.textContent).join('')
);
const BUILD_DATE = (() => {
  const d = new Date(document.lastModified);
  if (isNaN(d.getTime())) return 'UNKNOWN';
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
})();
const PAGE_NAME = (() => {
  try { const seg = window.location.pathname.split('/').pop(); return seg ? decodeURIComponent(seg) : 'index.html'; }
  catch (e) { return 'index.html'; }
})();

/* ---------- 5x7 pixel font ---------- */
const FONT = [
  'A 01110 10001 10001 11111 10001 10001 10001',
  'B 11110 10001 10001 11110 10001 10001 11110',
  'C 01111 10000 10000 10000 10000 10000 01111',
  'D 11110 10001 10001 10001 10001 10001 11110',
  'E 11111 10000 10000 11110 10000 10000 11111',
  'F 11111 10000 10000 11110 10000 10000 10000',
  'G 01111 10000 10000 10111 10001 10001 01111',
  'H 10001 10001 10001 11111 10001 10001 10001',
  'I 11111 00100 00100 00100 00100 00100 11111',
  'J 00111 00010 00010 00010 00010 10010 01100',
  'K 10001 10010 10100 11000 10100 10010 10001',
  'L 10000 10000 10000 10000 10000 10000 11111',
  'M 10001 11011 10101 10101 10001 10001 10001',
  'N 10001 11001 10101 10011 10001 10001 10001',
  'O 01110 10001 10001 10001 10001 10001 01110',
  'P 11110 10001 10001 11110 10000 10000 10000',
  'Q 01110 10001 10001 10001 10101 10010 01101',
  'R 11110 10001 10001 11110 10100 10010 10001',
  'S 01111 10000 10000 01110 00001 00001 11110',
  'T 11111 00100 00100 00100 00100 00100 00100',
  'U 10001 10001 10001 10001 10001 10001 01110',
  'V 10001 10001 10001 10001 10001 01010 00100',
  'W 10001 10001 10001 10101 10101 11011 10001',
  'X 10001 10001 01010 00100 01010 10001 10001',
  'Y 10001 10001 01010 00100 00100 00100 00100',
  'Z 11111 00001 00010 00100 01000 10000 11111',
  '0 01110 10001 10011 10101 11001 10001 01110',
  '1 00100 01100 00100 00100 00100 00100 01110',
  '2 01110 10001 00001 00010 00100 01000 11111',
  '3 11111 00010 00100 00010 00001 10001 01110',
  '4 00010 00110 01010 10010 11111 00010 00010',
  '5 11111 10000 11110 00001 00001 10001 01110',
  '6 00110 01000 10000 11110 10001 10001 01110',
  '7 11111 00001 00010 00100 01000 01000 01000',
  '8 01110 10001 10001 01110 10001 10001 01110',
  '9 01110 10001 10001 01111 00001 00010 01100',
  'SP 00000 00000 00000 00000 00000 00000 00000',
  '- 00000 00000 00000 11111 00000 00000 00000',
  '. 00000 00000 00000 00000 00000 00110 00110',
  ': 00000 00110 00110 00000 00110 00110 00000',
  '/ 00001 00010 00010 00100 01000 01000 10000',
  '+ 00000 00100 00100 11111 00100 00100 00000',
  '! 00100 00100 00100 00100 00100 00000 00100',
  '? 01110 10001 00001 00010 00100 00000 00100'
];
const GLYPH = {};
for (const line of FONT){
  const parts = line.split(' ');
  GLYPH[parts[0] === 'SP' ? ' ' : parts[0]] = parts.slice(1);
}
function textWidth(str, size, spacing = 1){ const n = str.length; return n ? n * 5 * size + (n - 1) * spacing * size : 0; }
function pText(str, x, y, size, color, o = {}){
  str = String(str).toUpperCase();
  const sp = o.spacing == null ? 1 : o.spacing;
  const w = textWidth(str, size, sp);
  let x0 = x;
  if (o.align === 'center') x0 = x - w / 2; else if (o.align === 'right') x0 = x - w;
  const p = new Path2D();
  for (let i = 0; i < str.length; i++){
    const g = GLYPH[str[i]] || GLYPH['?'];
    const gx = x0 + i * (5 + sp) * size;
    for (let r = 0; r < 7; r++){
      const row = g[r];
      for (let c = 0; c < 5; c++) if (row[c] === '1') p.rect(gx + c * size, y + r * size, size, size);
    }
  }
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.glow){ ctx.shadowBlur = o.glow * RS; ctx.shadowColor = o.glowColor || color; }
  ctx.fillStyle = color;
  ctx.fill(p);
  ctx.restore();
  return w;
}

/* ---------- tracked monospace text ---------- */
const MONO = '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, ui-monospace, monospace';
function tracked(str, x, y, o = {}){
  const size = o.size || 11, tr = o.tracking == null ? 2 : o.tracking, wt = o.weight || 500;
  ctx.save();
  ctx.font = `${wt} ${size}px ${MONO}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const chars = Array.from(String(str));
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + tr * Math.max(0, chars.length - 1);
  let cx = x;
  if (o.align === 'center') cx = x - total / 2; else if (o.align === 'right') cx = x - total;
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.fillStyle = o.color || C.ink;
  if (o.glow){ ctx.shadowBlur = o.glow * RS; ctx.shadowColor = o.glowColor || ctx.fillStyle; }
  for (let i = 0; i < chars.length; i++){ ctx.fillText(chars[i], cx, y); cx += widths[i] + tr; }
  ctx.restore();
  return total;
}

/* ---------- sprites (original designs) ---------- */
function makeSprite(rows, color, glow, o = {}){
  const cell = o.cell || 3, padd = o.pad == null ? 9 : o.pad;
  const cols = Math.max.apply(null, rows.map(r => r.length));
  const w = cols * cell, h = rows.length * cell;
  const tw = w + padd * 2, th = h + padd * 2;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(tw * RS); cv.height = Math.ceil(th * RS);
  const g = cv.getContext('2d');
  g.scale(RS, RS);
  g.translate(padd, padd);
  const p = new Path2D();
  rows.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === 'X') p.rect(c * cell, r * cell, cell, cell); });
  g.fillStyle = color; g.shadowColor = glow; g.shadowBlur = 7 * RS;
  g.fill(p);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,.38)';
  const hh = Math.max(1, cell * .34);
  rows.forEach((row, r) => {
    for (let c = 0; c < row.length; c++){
      if (row[c] === 'X' && (r === 0 || rows[r - 1][c] !== 'X')) g.fillRect(c * cell, r * cell, cell, hh);
    }
  });
  return { cv, w, h, tw, th, pad: padd };
}
const snap = v => Math.round(v * RS) / RS;
function drawSprite(s, x, y, scale = 1, alpha = 1){
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.drawImage(s.cv, snap(x - s.pad * scale), snap(y - s.pad * scale), s.tw * scale, s.th * scale);
  ctx.restore();
}

const ART = {
  drone: [[
    'X..XX..X',
    '.XXXXXX.',
    'XX.XX.XX',
    'XXXXXXXX',
    '.X.XX.X.',
    '..XXXX..',
    '.X....X.',
    'X......X'
  ],[
    '...XX...',
    'XXXXXXXX',
    'XX.XX.XX',
    'XXXXXXXX',
    '.X.XX.X.',
    '..XXXX..',
    '..X..X..',
    '.X....X.'
  ]],
  wing: [[
    'X.........X',
    'XX..XXX..XX',
    'XXXXXXXXXXX',
    '.XX.XXX.XX.',
    '..XXXXXXX..',
    '...X.X.X...',
    '..X.....X..',
    '.X.......X.'
  ],[
    '...........',
    'X...XXX...X',
    'XXXXXXXXXXX',
    'XXX.XXX.XXX',
    '.XXXXXXXXX.',
    '...X.X.X...',
    '...X...X...',
    '..X.....X..'
  ]],
  brute: [[
    '..XXXXXXXX..',
    '.XXXXXXXXXX.',
    'XX..XXXX..XX',
    'XXXXXXXXXXXX',
    'XXXXXXXXXXXX',
    '.X.X.XX.X.X.',
    'X..........X',
    '.X........X.'
  ],[
    '..XXXXXXXX..',
    '.XXXXXXXXXX.',
    'XX..XXXX..XX',
    'XXXXXXXXXXXX',
    'XXXXXXXXXXXX',
    '.X.X.XX.X.X.',
    '.X........X.',
    'X..........X'
  ]],
  ship: [
    '.......X.......',
    '......XXX......',
    '......XXX......',
    '.....XXXXX.....',
    '..X..XX.XX..X..',
    '..XXXXXXXXXXX..',
    'XXXXXXXXXXXXXXX',
    'XXX..XXXXX..XXX'
  ],
  ufo: [
    '......XXXX......',
    '....XXXXXXXX....',
    '..XX.XX..XX.XX..',
    'XXXXXXXXXXXXXXXX',
    '.XXXXXXXXXXXXXX.',
    '...XX..XX..XX...',
    '....X...X...X...'
  ]
};

const ENEMY_TYPES = [
  { key:'drone', color:C.pink,  glow:C.pinkGlow,  points:30 },
  { key:'wing',  color:C.cyan,  glow:'#00d8ff',   points:20 },
  { key:'brute', color:C.amber, glow:C.amberGlow, points:10 }
];
for (const t of ENEMY_TYPES) t.frames = ART[t.key].map(rows => makeSprite(rows, t.color, t.glow));
const shipSprite = makeSprite(ART.ship, C.mint, C.greenGlow, { pad:10 });
const ufoSprite = makeSprite(ART.ufo, C.red, C.redGlow, { pad:9, cell:3 });

/* ---------- UI geometry ---------- */
const INFO_ICON_RECT = { x:W - 78, y:73, w:78, h:78 };
const INFO_RECT = { x:45, y:160, w:540, h:450 };
const INFO_RESET_RECT = { x:75, y:466, w:480, h:78 };
const RESET_CONFIRM_RECT = { x:65, y:185, w:500, h:360 };
const RESET_YES_RECT = { x:95, y:336, w:440, h:78 };
const RESET_NO_RECT = { x:95, y:422, w:440, h:78 };
const PAUSE_RECT = { x:55, y:200, w:520, h:320 };
const PAUSE_RESUME_RECT = { x:125, y:340, w:380, h:78 };
const PAUSE_TITLE_RECT = { x:125, y:426, w:380, h:78 };
const GAME_OVER_RECT = { x:55, y:160, w:520, h:440 };
const GAME_OVER_PLAY_RECT = { x:125, y:420, w:380, h:78 };
const GAME_OVER_TITLE_RECT = { x:125, y:506, w:380, h:78 };
const WAVE_CLEAR_RECT = { x:65, y:156, w:500, h:208 };

/* ---------- state ---------- */
const game = {
  mode:'menu', score:0, hiScore:storedHiScore(), wave:1, lives:3, nextExtra:5000, newHigh:false,
  time:0, shake:0, damageFlash:0,
  dyingTimer:0, dyingReason:'destroyed', endReason:'destroyed',
  waveClearTimer:0, waveBonus:0, banner:null
};
let infoOpen = false, resetConfirm = false, prevMode = 'playing';
function makePlayer(){ return { x:315, y:634, w:45, h:24, speed:245, cool:0, invuln:.9, flash:0, dead:false }; }
let player = makePlayer();
let F = null;
let bunkers = [];
const bullets = [], bombs = [], particles = [], rings = [], ricochets = [], floaters = [];
let ufo = null, ufoTimer = rand(6, 11);
let muzzle = 0;
const held = { left:false, right:false, fire:false };
const touch = { left:false, right:false, fire:false };
const ptr = { active:false, id:null, x:W / 2, fire:false };
let hoverP = null;
const stars = Array.from({ length:155 }, () => ({ x:Math.random() * W, y:Math.random() * H, z:Math.random(), ph:Math.random() * 6.283 }));

function clearHeld(){
  held.left = held.right = held.fire = false;
  touch.left = touch.right = touch.fire = false;
  ptr.active = false; ptr.fire = false; ptr.id = null;
}

/* ---------- audio ---------- */
let AC = null, master = null, noiseBuf = null;
let soundOn = lsGet(KEY_SOUND) !== 'off';
function initAudio(){
  if (!AC){
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    try { AC = new A(); } catch (e) { AC = null; return; }
    master = AC.createGain();
    master.gain.value = soundOn ? .55 : 0;
    master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * .5), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended' && AC.resume) AC.resume();
}
function tone(freq, endFreq, duration, type, volume, delay = 0){
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq && endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
  g.gain.setValueAtTime(volume, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + duration);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + duration + .02);
}
function noise(duration, volume, delay = 0, cutoff = 2000){
  if (!AC || !soundOn || !noiseBuf) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true;
  f.type = 'lowpass'; f.frequency.value = cutoff;
  g.gain.setValueAtTime(volume, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + duration);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + duration + .02);
}
const sfx = {
  shoot(){ tone(760, 180, .09, 'square', .025); },
  enemyShoot(){ tone(230, 150, .08, 'sawtooth', .011); },
  march(b){ const f = [116, 103, 92, 82][b]; tone(f, f * .86, .055, 'square', .018); },
  invaderHit(){ noise(.065, .026, 0, 3200); tone(620, 220, .08, 'square', .018); },
  clash(){ noise(.09, .022, 0, 2800); tone(540, 170, .11, 'triangle', .018); },
  playerHit(){ noise(.55, .06, 0, 750); tone(160, 34, .62, 'sawtooth', .05); },
  ufoHum(f){ tone(f, f, .065, 'square', .009); },
  ufoHit(){ [620, 760, 980, 1320].forEach((f, i) => tone(f, f, .09, 'triangle', .027, i * .055)); noise(.18, .04, 0, 3000); },
  ufoDeflect(){ noise(.07, .03, 0, 5200); tone(210, 1050, .15, 'triangle', .028); tone(1480, 620, .1, 'square', .012, .045); },
  extra(){ [520, 660, 880].forEach((f, i) => tone(f, f, .1, 'triangle', .028, i * .08)); },
  waveClear(){ [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, f, .12, 'triangle', .026, i * .1)); },
  gameOver(){ [262, 220, 175, 131].forEach((f, i) => tone(f, f * .84, .23, 'sawtooth', .026, i * .18)); },
  start(){ [262, 330, 392, 523].forEach((f, i) => tone(f, f, .1, 'square', .024, i * .085)); },
  ready(){ tone(440, 660, .12, 'triangle', .022); },
  ui(){ tone(880, 660, .04, 'square', .01); }
};
function toggleSound(){
  soundOn = !soundOn;
  lsSet(KEY_SOUND, soundOn ? 'on' : 'off');
  if (AC && master) master.gain.setValueAtTime(soundOn ? .55 : 0, AC.currentTime);
  syncUI();
  announce(soundOn ? 'Sound on.' : 'Sound off.');
  if (soundOn) sfx.ui();
}

/* ---------- announcements ---------- */
let announceT = 0;

  live.textContent = '';
  clearTimeout(announceT);
  announceT = setTimeout(() => { live.textContent = msg; }, 40);
}

/* ---------- bunkers ---------- */
function makeBunker(i){
  const gap = (W - 72 * 4) / 5;
  const x = Math.round(gap + i * (72 + gap)), y = 500;
  const cells = new Uint8Array(24 * 17);
  for (let r = 0; r < 17; r++){
    for (let c = 0; c < 24; c++){
      let on = 1;
      if (r < 2 && (c < 3 || c >= 21)) on = 0;
      else if (r < 4 && (c < 2 || c >= 22)) on = 0;
      if (r >= 9){ const half = 3.2 + (r - 9) * .58; if (Math.abs(c - 11.5) < half) on = 0; }
      cells[r * 24 + c] = on;
    }
  }
  const cv = document.createElement('canvas');
  cv.width = 84 * RS; cv.height = 63 * RS;
  return { x, y, cells, cv, g:cv.getContext('2d'), dirty:true };
}
function renderBunker(b){
  const g = b.g, cells = b.cells;
  g.setTransform(RS, 0, 0, RS, 0, 0);
  g.clearRect(0, 0, 84, 63);
  g.translate(6, 6);
  const p = new Path2D();
  for (let r = 0; r < 17; r++) for (let c = 0; c < 24; c++) if (cells[r * 24 + c]) p.rect(c * 3, r * 3, 3, 3);
  g.fillStyle = '#35d68d'; g.shadowColor = '#25ff9c'; g.shadowBlur = 6 * RS;
  g.fill(p);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(190,255,218,.67)';
  for (let r = 0; r < 17; r++) for (let c = 0; c < 24; c++){
    const i = r * 24 + c;
    if (cells[i] && (r === 0 || !cells[i - 24])) g.fillRect(c * 3, r * 3, 3, 1);
  }
  g.fillStyle = 'rgba(4,36,22,.35)';
  for (let r = 0; r < 17; r++) for (let c = 0; c < 24; c++){
    if (cells[r * 24 + c] && (c * 7 + r * 11) % 13 === 0) g.fillRect(c * 3, r * 3, 3, 3);
  }
  b.dirty = false;
}
function bunkerAt(px, py){
  for (const b of bunkers){
    if (px < b.x || px >= b.x + 72 || py < b.y || py >= b.y + 51) continue;
    const c = clamp(Math.floor((px - b.x) / 3), 0, 23), r = clamp(Math.floor((py - b.y) / 3), 0, 16);
    if (b.cells[r * 24 + c]) return b;
  }
  return null;
}
function damageBunker(b, px, py, radius){
  const cx = (px - b.x) / 3, cy = (py - b.y) / 3, R = radius / 3;
  const c0 = Math.max(0, Math.floor(cx - R * 1.2)), c1 = Math.min(23, Math.ceil(cx + R * 1.2));
  const r0 = Math.max(0, Math.floor(cy - R * 1.2)), r1 = Math.min(16, Math.ceil(cy + R * 1.2));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
    const i = r * 24 + c;
    if (!b.cells[i]) continue;
    if (Math.hypot(c + .5 - cx, r + .5 - cy) < R * rand(.78, 1.15)){
      b.cells[i] = 0;
      if (Math.random() < .55) addParticle(b.x + c * 3 + 1.5, b.y + r * 3 + 1.5, rand(-60, 60), rand(-80, 40), { color:C.green, life:rand(.25, .55), size:rand(1.5, 2.5), g:220 });
    }
  }
  b.dirty = true;
}
function crushBunkers(){
  if (!F) return;
  for (const v of F.inv){
    if (!v.alive) continue;
    const x = F.x + v.offX, y = F.y + v.offY;
    for (const b of bunkers){
      if (x + v.w <= b.x || x >= b.x + 72 || y + v.h <= b.y || y >= b.y + 51) continue;
      const c0 = clamp(Math.floor((x - b.x) / 3), 0, 23), c1 = clamp(Math.floor((x + v.w - 1 - b.x) / 3), 0, 23);
      const r0 = clamp(Math.floor((y - b.y) / 3), 0, 16), r1 = clamp(Math.floor((y + v.h - 1 - b.y) / 3), 0, 16);
      let any = false;
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
        const i = r * 24 + c;
        if (b.cells[i]){ b.cells[i] = 0; any = true; }
      }
      if (any) b.dirty = true;
    }
  }
}

/* ---------- effects ---------- */
function addParticle(x, y, vx, vy, o = {}){
  if (particles.length >= 620) particles.shift();
  const life = o.life == null ? .5 : o.life;
  particles.push({ x, y, vx, vy, g:o.g == null ? 0 : o.g, drag:o.drag == null ? 1.8 : o.drag, life, max:life, size:o.size || 2, color:o.color || C.ink });
}
function burst(x, y, color, n, sp = 160, size = [1.5, 3], life = [.3, .7], g = 60){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = rand(sp * .25, sp);
    addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, { color, size:rand(size[0], size[1]), life:rand(life[0], life[1]), g });
  }
}
function ring(x, y, color, r0, r1, life){ rings.push({ x, y, color, r0, r1, t:0, life }); }
function floater(x, y, text, color){ floaters.push({ x, y, text, color, t:0, life:1.1 }); }
function shake(v){ game.shake = Math.max(game.shake, v); }

function updateEffects(dt){
  let j = 0;
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) continue;
    const k = Math.max(0, 1 - p.drag * dt);
    p.vx *= k; p.vy *= k; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    particles[j++] = p;
  }
  particles.length = j;
  for (let i = rings.length - 1; i >= 0; i--){ rings[i].t += dt; if (rings[i].t >= rings[i].life) rings.splice(i, 1); }
  for (let i = ricochets.length - 1; i >= 0; i--){
    const r = ricochets[i];
    r.life -= dt;
    if (r.life <= 0){ ricochets.splice(i, 1); continue; }
    r.vy += 420 * dt; r.x += r.vx * dt; r.y += r.vy * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.t += dt; f.y -= 28 * dt;
    if (f.t >= f.life) floaters.splice(i, 1);
  }
  game.shake = Math.max(0, game.shake - 34 * dt);
  game.damageFlash = Math.max(0, game.damageFlash - 2.6 * dt);
  muzzle = Math.max(0, muzzle - dt);
  if (game.banner){ game.banner.t += dt; if (game.banner.t >= game.banner.dur) game.banner = null; }
}

/* ---------- waves & formation ---------- */
function buildWave(n){
  const inv = [];
  for (let row = 0; row < 5; row++){
    const t = ENEMY_TYPES[row === 0 ? 0 : row < 3 ? 1 : 2];
    const sw = t.frames[0].w, sh = t.frames[0].h;
    for (let col = 0; col < 11; col++){
      inv.push({ col, row, t, alive:true, offX:col * 45 + (36 - sw) / 2, offY:row * 39 + 8, w:sw, h:sh });
    }
  }
  F = { x:Math.round((W - 486) / 2), y:130, dir:1, frame:0, stepTimer:0, fireTimer:rand(.7, 1.25), beat:0, aliveCount:55, inv };
  bunkers = [0, 1, 2, 3].map(makeBunker);
  bullets.length = 0; bombs.length = 0;
  ufo = null; ufoTimer = rand(6, 11);
  game.banner = n === 1
    ? { title:'WAVE 01', subtitle:'DEFEND THE SECTOR', t:0, dur:2 }
    : { title:'WAVE ' + pad(n, 2), subtitle:'SECTOR ' + pad(n, 2) + ' - HOLD THE LINE', t:0, dur:2 };
}
function marchInterval(){
  const ratio = clamp(F.aliveCount / 55, .02, 1);
  const base = Math.max(.34, .69 - (game.wave - 1) * .045);
  return Math.max(.085, base * Math.pow(ratio, .62));
}
function formBounds(){
  let minX = 1e9, maxX = -1e9, maxY = -1e9;
  for (const v of F.inv){
    if (!v.alive) continue;
    const x = F.x + v.offX, y = F.y + v.offY;
    if (x < minX) minX = x;
    if (x + v.w > maxX) maxX = x + v.w;
    if (y + v.h > maxY) maxY = y + v.h;
  }
  return { minX, maxX, maxY };
}
function marchStep(){
  const b = formBounds();
  const nx = F.dir * 6;
  if ((F.dir > 0 && b.maxX + nx > W - 18) || (F.dir < 0 && b.minX + nx < 18)){
    F.y += 21; F.dir *= -1; crushBunkers();
  } else {
    F.x += nx;
  }
  F.frame ^= 1;
  sfx.march(F.beat);
  F.beat = (F.beat + 1) % 4;
  const b2 = formBounds();
  if (b2.maxY >= 460) crushBunkers();
  if (b2.maxY > DANGER_Y) invasion();
}
function enemyFire(dt){
  F.fireTimer -= dt;
  if (F.fireTimer > 0) return;
  const progress = 1 - F.aliveCount / 55;
  const speedUp = clamp(1 - (game.wave - 1) * .07 - progress * .38, .4, 1);
  F.fireTimer = rand(.45, 1.12) * speedUp;
  const cap = Math.min(7, 3 + Math.floor(game.wave / 2) + (F.aliveCount < 12 ? 1 : 0));
  if (bombs.length >= cap) return;
  const bottoms = [];
  for (let c = 0; c < 11; c++){
    let best = null;
    for (const v of F.inv) if (v.alive && v.col === c && (!best || v.row > best.row)) best = v;
    if (best) bottoms.push(best);
  }
  if (!bottoms.length) return;
  const v = bottoms[Math.floor(Math.random() * bottoms.length)];
  bombs.push({ x:F.x + v.offX + v.w / 2 - 2, y:F.y + v.offY + v.h, w:4, h:13, vy:245 + game.wave * 11 + rand(0, 45) });
  sfx.enemyShoot();
}

/* ---------- UFO ---------- */
function ufoY(){ return 97 + (RM ? 0 : Math.sin(game.time * 4.4) * 2); }
function spawnUfo(){
  const dir = Math.random() < .5 ? 1 : -1;
  const armored = Math.random() < UFO_DEFLECTOR_CHANCE;
  ufo = {
    x:dir > 0 ? -72 : W + 72, dir, speed:122 + game.wave * 8, armored, shielded:false, shield:0,
    points:armored ? 1000 : [100, 150, 300][Math.floor(Math.random() * 3)],
    w:ufoSprite.w, h:ufoSprite.h, hum:0, humAlt:false
  };
}
function updateUfo(dt){
  if (!ufo){ ufoTimer -= dt; if (ufoTimer <= 0) spawnUfo(); return; }
  ufo.x += ufo.dir * ufo.speed * dt;
  ufo.shield = Math.max(0, ufo.shield - dt);
  ufo.hum -= dt;
  if (ufo.hum <= 0){ ufo.hum = .19; ufo.humAlt = !ufo.humAlt; sfx.ufoHum(ufo.humAlt ? 680 : 540); }
  if ((ufo.dir > 0 && ufo.x > W + 72) || (ufo.dir < 0 && ufo.x + ufo.w < -72)){ ufo = null; ufoTimer = rand(14, 24); }
}
function hitUfo(x, y){
  if (ufo.armored && !ufo.shielded){
    ufo.shielded = true; ufo.shield = .5;
    for (let i = 0; i < 8; i++){
      const a = Math.PI / 2 + rand(-1.25, 1.25), s = rand(180, 330);
      ricochets.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:rand(.25, .45), max:.45, color:i % 2 ? C.white : C.cyan });
    }
    ring(ufo.x + ufo.w / 2, ufoY() + ufo.h / 2, C.cyan, 10, 40, .35);
    shake(4);
    sfx.ufoDeflect();
    return;
  }
  const cx = ufo.x + ufo.w / 2, cy = ufoY() + ufo.h / 2;
  addScore(ufo.points);
  floater(cx, cy - 18, String(ufo.points), ufo.armored ? C.amber : C.red);
  burst(cx, cy, C.amber, 24, 240, [1.5, 3.5], [.4, .9], 60);
  burst(cx, cy, C.red, 18, 200, [1.5, 3], [.3, .8], 60);
  ring(cx, cy, C.amber, 4, 46, .45);
  ring(cx, cy, C.red, 8, 72, .7);
  shake(10);
  sfx.ufoHit();
  ufo = null; ufoTimer = rand(15, 24);
}

/* ---------- scoring ---------- */
function addScore(n){
  game.score += n;
  if (game.score > game.hiScore){ game.hiScore = game.score; game.newHigh = true; }
  if (game.score >= game.nextExtra){
    if (game.lives < 5){
      game.lives++;
      floater(player.x, player.y - 20, 'EXTRA SHIP', C.mint);
      sfx.extra();
      announce('Extra ship awarded.');
    }
    game.nextExtra = (Math.floor(game.score / 5000) + 1) * 5000;
  }
}
function killInvader(v, x, y){
  v.alive = false;
  F.aliveCount--;
  const cx = x + v.w / 2, cy = y + v.h / 2;
  burst(cx, cy, v.t.color, 16, 170, [1.5, 3.2], [.3, .7], 40);
  ring(cx, cy, v.t.color, 3, 22, .32);
  floater(cx, y - 6, '+' + v.t.points, v.t.color);
  sfx.invaderHit();
  shake(1.5);
  addScore(v.t.points);
  if (F.aliveCount <= 0) waveClear();
}

/* ---------- player ---------- */
function updatePlayer(dt, canFire){
  const p = player;
  if (p.dead) return;
  p.invuln = Math.max(0, p.invuln - dt);
  p.cool = Math.max(0, p.cool - dt);
  let dir = 0;
  if (held.left || touch.left) dir -= 1;
  if (held.right || touch.right) dir += 1;
  if (dir) p.x += dir * p.speed * dt;
  else if (ptr.active){
    const d = ptr.x - p.x, step = p.speed * dt;
    p.x += Math.abs(d) <= step ? d : Math.sign(d) * step;
  }
  p.x = clamp(p.x, 34, W - 34);
  const wantFire = held.fire || touch.fire || (ptr.active && ptr.fire);
  if (canFire && wantFire && p.cool <= 0 && bullets.length === 0){
    bullets.push({ x:p.x - 2, y:p.y - 7, w:4, h:14, vy:-930 });
    p.cool = .32;
    muzzle = .07;
    for (let i = 0; i < 5; i++) addParticle(p.x + rand(-2, 2), p.y - 4, rand(-50, 50), rand(-160, -60), { color:C.cyan, size:rand(1, 2), life:rand(.1, .22) });
    sfx.shoot();
  }
}
function bulletCollide(b){
  const bx = b.x, by = b.y;
  for (let j = bombs.length - 1; j >= 0; j--){
    const m = bombs[j];
    if (bx < m.x + m.w + 2 && bx + b.w > m.x - 2 && by < m.y + m.h && by + b.h > m.y){
      bombs.splice(j, 1);
      burst(bx + 2, by, C.cyan, 10, 140, [1, 2.5], [.2, .45], 0);
      ring(bx + 2, by, C.cyan, 2, 16, .3);
      shake(3);
      sfx.clash();
      return true;
    }
  }
  if (ufo){
    const uy = ufoY();
    if (bx < ufo.x + ufo.w && bx + b.w > ufo.x && by < uy + ufo.h && by + b.h > uy){ hitUfo(bx + 2, by); return true; }
  }
  if (F){
    for (const v of F.inv){
      if (!v.alive) continue;
      const x = F.x + v.offX, y = F.y + v.offY;
      if (bx < x + v.w && bx + b.w > x && by < y + v.h && by + b.h > y){ killInvader(v, x, y); return true; }
    }
  }
  for (const px of [bx + 2, bx + .5, bx + 3.5]){
    const bk = bunkerAt(px, by);
    if (bk){ damageBunker(bk, px, by, 5.1); return true; }
  }
  return false;
}
function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if (!b) continue;
    const dist = b.vy * dt, steps = Math.max(1, Math.ceil(Math.abs(dist) / 6));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++){ b.y += dist / steps; dead = bulletCollide(b); }
    if (dead){ const k = bullets.indexOf(b); if (k >= 0) bullets.splice(k, 1); }
    else if (b.y + b.h < 84){
      burst(b.x + 2, 84, C.cyan, 4, 60, [1, 2], [.15, .3], 0);
      bullets.splice(i, 1);
    }
  }
}
function bombCollide(m){
  const tipY = m.y + m.h;
  for (const px of [m.x + 2, m.x + .5, m.x + 3.5]){
    const bk = bunkerAt(px, tipY);
    if (bk){ damageBunker(bk, px, tipY, 5.8); return true; }
  }
  const p = player;
  if (!p.dead && game.mode === 'playing'){
    if (m.x + m.w >= p.x - 18 && m.x <= p.x + 18 && tipY >= p.y + 4 && m.y <= p.y + p.h){
      if (p.invuln > 0) return false;
      playerHit();
      return true;
    }
  }
  return false;
}
function updateBombs(dt){
  for (let i = bombs.length - 1; i >= 0; i--){
    const m = bombs[i];
    if (!m) continue;
    const dist = m.vy * dt, steps = Math.max(1, Math.ceil(dist / 6));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++){ m.y += dist / steps; dead = bombCollide(m); }
    if (dead){ const k = bombs.indexOf(m); if (k >= 0) bombs.splice(k, 1); }
    else if (m.y + m.h >= GROUND_Y){
      burst(m.x + 2, GROUND_Y, C.red, 6, 90, [1, 2], [.2, .4], 120);
      bombs.splice(i, 1);
    }
  }
}

/* ---------- flow ---------- */
function startNewGame(){
  initAudio();
  clearHeld();
  canvas.style.cursor = 'crosshair';
  Object.assign(game, {
    score:0, wave:1, lives:3, nextExtra:5000, newHigh:false, endReason:'destroyed',
    shake:0, damageFlash:0, banner:null, dyingTimer:0, waveClearTimer:0, waveBonus:0
  });
  game.hiScore = storedHiScore();
  infoOpen = false; resetConfirm = false;
  particles.length = 0; rings.length = 0; ricochets.length = 0; floaters.length = 0;
  player = makePlayer();
  buildWave(1);
  game.mode = 'playing';
  sfx.start();
  syncUI();
  announce('Game started. Wave 1. Defend the sector.');
}
function playerHit(){
  if (game.mode !== 'playing' || player.invuln > 0 || player.dead) return;
  game.lives = Math.max(0, game.lives - 1);
  game.mode = 'dying'; game.dyingTimer = 1.65; game.dyingReason = 'destroyed';

  shake(17);
  player.dead = true;
  const cx = player.x, cy = player.y + 12;
  burst(cx, cy, C.mint, 40, 260, [1.5, 3.5], [.4, 1.1], 80);
  burst(cx, cy, C.white, 12, 180, [1, 2], [.3, .6], 40);
  ring(cx, cy, C.green, 4, 60, .6);
  sfx.playerHit();
  bombs.length = 0; bullets.length = 0;

  announce(game.lives > 0 ? `Ship destroyed. ${game.lives} ${game.lives === 1 ? 'life' : 'lives'} remaining.` : 'Final ship destroyed.');

/* ---------- update ---------- */
function update(dt){
  const m = game.mode;
  if (m === 'paused') return;
  game.time += dt;
  const sm = RM ? .25 : 1;
  for (const s of stars){
    s.y += (4 + s.z * 23) * dt * sm;
    if (s.y > H){ s.y -= H; s.x = Math.random() * W; }
  }
  updateEffects(dt);
  if (m === 'playing'){
    updatePlayer(dt, true);
    updateBullets(dt);
    if (game.mode === 'playing') updateBombs(dt);
    if (game.mode === 'playing'){
      F.stepTimer += dt;
      if (F.stepTimer >= marchInterval()){ F.stepTimer = 0; marchStep(); }
    }
    if (game.mode === 'playing') enemyFire(dt);
    if (game.mode === 'playing') updateUfo(dt);
  } else if (m === 'dying'){
    game.dyingTimer -= dt;
    if (game.dyingTimer <= 0){
      if (game.dyingReason === 'invaded') endGame('invaded');
      else if (game.lives <= 0) endGame('destroyed');
      else respawn();
    }
  } else if (m === 'waveclear'){
    updatePlayer(dt, false);
    game.waveClearTimer -= dt;
    if (game.waveClearTimer <= 0){
      game.wave++;
      buildWave(game.wave);
      game.mode = 'playing';
      announce(`Wave ${game.wave}. Sector ${game.wave}. Hold the line.`);
    }
  }
}

/* ---------- drawing helpers ---------- */
function dim(a){ ctx.fillStyle = `rgba(2,4,10,${a})`; ctx.fillRect(0, 0, W, H); }
function panelPath(r, c = 12){
  const { x, y, w, h } = r;
  ctx.beginPath();
  ctx.moveTo(x + c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - c);
  ctx.lineTo(x + w - c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + c);
  ctx.closePath();
}
function panel(r, accent, alpha = 1, fill = 'rgba(4,10,18,.9)', hot = false){
  ctx.save();
  ctx.globalAlpha *= alpha;
  panelPath(r);
  ctx.fillStyle = fill; ctx.fill();
  if (hot){ ctx.fillStyle = hexA(accent, .1); ctx.fill(); }
  ctx.save();
  ctx.globalAlpha *= hot ? 1 : .75;
  ctx.strokeStyle = accent; ctx.lineWidth = 1.2;
  ctx.shadowColor = accent; ctx.shadowBlur = 10 * RS;
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = accent;
  ctx.fillRect(r.x + r.w - 30, r.y - 1, 18, 2);
  ctx.fillRect(r.x + 12, r.y + r.h - 1, 18, 2);
  ctx.restore();
}
function drawActionRow(r, label, hint, accent, alpha = 1, warning = null, ts = 1){
  const hot = inRect(hoverP, r);
  panel(r, accent, alpha, 'rgba(5,12,20,.9)', hot);
  const cy = r.y + r.h / 2;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const lw = tracked(label, r.x + 26, cy, { size:12 * ts, tracking:2.4 * ts, color:C.ink, weight:600 });
  tracked(hint, r.x + r.w - 26, cy, { size:9 * ts, tracking:1.8 * ts, color:accent, align:'right' });
  ctx.restore();
  if (warning){
    ctx.save();
    ctx.globalAlpha = 1;
    tracked(warning, r.x + 26 + lw + 10 * ts, cy, { size:9 * ts, tracking:1.1 * ts, color:C.amber, weight:600 });
    ctx.restore();
  }
}
function uiScale(){
  const r = canvas.getBoundingClientRect();
  return clamp(630 / (r.width || 630), 1, 1.75);

function drawBackground(){

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  g.addColorStop(0, 'rgba(43,170,199,.11)'); g.addColorStop(1, 'rgba(43,170,199,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W * .78, 470, 0, W * .78, 470, 430);
  g.addColorStop(0, 'rgba(255,43,184,.075)'); g.addColorStop(1, 'rgba(255,43,184,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 560, 0, H);

}

function drawPlayer(){
  const p = player;
  if (p.dead) return;
  const blink = p.invuln > 0 && Math.floor(game.time * 12) % 2 === 0;
  const fx = p.x, fy = p.y + p.h;
  ctx.save();

  eg.addColorStop(0, 'rgba(141,255,196,.35)'); eg.addColorStop(1, 'rgba(141,255,196,0)');
  ctx.fillStyle = eg; ctx.fillRect(fx - 20, fy - 20, 40, 40);

  ctx.globalAlpha = .85; ctx.fillStyle = C.mint;
  ctx.beginPath(); ctx.moveTo(fx - 4, fy - 1); ctx.lineTo(fx + 4, fy - 1); ctx.lineTo(fx, fy + fh); ctx.closePath(); ctx.fill();

    mg.addColorStop(0, 'rgba(220,255,255,.9)'); mg.addColorStop(1, 'rgba(117,244,255,0)');
    ctx.fillStyle = mg; ctx.fillRect(p.x - 10, p.y - 14, 20, 20);

}
function drawWorld(){
  for (const b of bunkers){ if (b.dirty) renderBunker(b); ctx.drawImage(b.cv, b.x - 6, b.y - 6, 84, 63); }
  if (F){
    for (const v of F.inv) if (v.alive) drawSprite(v.t.frames[F.frame], F.x + v.offX, F.y + v.offY);
  }
  if (ufo){
    const y = ufoY();

    for (let i = 0; i < 4; i++){
      const on = (Math.floor(game.time * 8) + i) % 2 === 0;
      ctx.fillStyle = on ? C.amber : 'rgba(255,95,115,.35)';
      ctx.fillRect(ufo.x + 9 + i * 9, y + ufo.h + 4, 3, 2);
    }
    if (ufo.armored){
      ctx.save();
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.5;
      ctx.globalAlpha = ufo.shielded ? .4 + ufo.shield * 1.2 : .16;
      ctx.shadowColor = C.cyan; ctx.shadowBlur = 8 * RS;
      ctx.beginPath(); ctx.ellipse(ufo.x + ufo.w / 2, y + ufo.h / 2, 34, 18, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  const flip = F ? F.frame === 1 : false;
  for (const m of bombs){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,35,72,.16)';
    ctx.fillRect(m.x + 2 - 5, m.y - 4, 10, m.h + 8);
    ctx.beginPath();
    for (let i = 0; i <= 5; i++){
      const px = m.x + 2 + (((i % 2 === 0) !== flip) ? -2 : 2), py = m.y + i * m.h / 5;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.strokeStyle = C.red; ctx.lineWidth = 2.4; ctx.shadowColor = C.redGlow; ctx.shadowBlur = 12 * RS;
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#ffe0ee'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  drawPlayer();
  for (const b of bullets){
    ctx.save();
    ctx.globalAlpha = .16; ctx.fillStyle = C.cyan;
    ctx.fillRect(b.x, b.y + b.h, b.w, 23);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 12 * RS;
    ctx.fillStyle = '#dcffff';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    const a = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a * .25;
    ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
    ctx.globalAlpha = a;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    if (p.size >= 3){
      ctx.globalAlpha = a * .5;
      ctx.fillRect(p.x - p.size * 1.6, p.y - .5, p.size * 3.2, 1);
      ctx.fillRect(p.x - .5, p.y - p.size * 1.6, 1, p.size * 3.2);
    }
  }
  ctx.lineWidth = 1.5;
  for (const r of ricochets){
    ctx.globalAlpha = clamp(r.life / r.max, 0, 1);
    ctx.strokeStyle = r.color;
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * .03, r.y - r.vy * .03); ctx.stroke();
  }
  for (const r of rings){
    const k = r.t / r.life, e = 1 - Math.pow(1 - k, 3);

    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  for (const f of floaters){

  }
  if (game.damageFlash > 0){
    ctx.fillStyle = `rgba(255,47,76,${(game.damageFlash * .3).toFixed(3)})`;
    ctx.fillRect(-30, -30, W + 60, H + 60);
  }
}

  rows.forEach((r, i) => {
    const y = R.y + 88 + i * 38;
    tracked(r[0], R.x + 30, y, { size:10 * s, tracking:1.8 * s, color:C.muted });
    tracked(r[1], R.x + R.w - 30, y, { size:10 * s, tracking:1 * s, color:r[2], align:'right' });
  });
  ctx.fillStyle = 'rgba(141,255,196,.18)'; ctx.fillRect(R.x + 30, 456, R.w - 60, 1);
  drawActionRow(INFO_RESET_RECT, 'RESET HIGH SCORE', 'R', C.amber, 1, null, s);
  if (!resetConfirm){
    tracked('TAP ELSEWHERE OR PRESS I TO CLOSE', W / 2, R.y + R.h - 26, { size:9 * s, tracking:1.6 * s, color:C.muted, align:'center' });
  } else {
    drawConfirm(s);
  }
}
function drawConfirm(s){
  const R = RESET_CONFIRM_RECT;
  ctx.fillStyle = 'rgba(2,6,12,.84)'; ctx.fillRect(INFO_RECT.x, INFO_RECT.y, INFO_RECT.w, INFO_RECT.h);
  panel(R, C.amber, 1, 'rgba(6,10,14,.97)');
  tracked('RESET HIGH SCORE?', W / 2, 225, { size:13 * s, tracking:2.4 * s, color:C.amber, align:'center', weight:600 });
  tracked('SET ARCADE BEST TO ZERO?', W / 2, 263, { size:10 * s, tracking:1.8 * s, color:C.ink, align:'center' });
  tracked('CURRENT BEST ' + pad(storedHiScore(), 6), W / 2, 291, { size:10 * s, tracking:1.8 * s, color:C.muted, align:'center' });
  tracked('THIS CANNOT BE UNDONE', W / 2, 317, { size:8.5 * s, tracking:2 * s, color:C.red, align:'center' });
  drawActionRow(RESET_YES_RECT, 'YES, RESET', 'Y', C.red, 1, null, s);
  drawActionRow(RESET_NO_RECT, 'NO, KEEP SCORE', 'N / ESC', C.mint, 1, null, s);
}
function drawPause(){
  dim(.55);
  panel(PAUSE_RECT, C.cyan, 1, 'rgba(3,8,14,.94)');
  tracked('SYSTEM HALTED', W / 2, 236, { size:9, tracking:3.2, color:C.cyanSoft, align:'center' });
  pText('PAUSED', W / 2, 258, 6, C.ink, { align:'center', glow:18, glowColor:C.cyan });
  const g = ctx.createLinearGradient(W / 2 - 169, 0, W / 2 + 169, 0);
  g.addColorStop(0, 'rgba(117,244,255,0)'); g.addColorStop(.5, 'rgba(117,244,255,.55)'); g.addColorStop(1, 'rgba(117,244,255,0)');
  ctx.fillStyle = g; ctx.fillRect(W / 2 - 169, 322, 338, 1);
  drawActionRow(PAUSE_RESUME_RECT, 'RESUME', 'P / ESC / ENTER', C.cyan);
  drawActionRow(PAUSE_TITLE_RECT, 'TITLE SCREEN', 'Q', C.cyanSoft, .82, game.newHigh ? '[HIGH SCORE LOST]' : null);
}
function drawGameOver(){
  dim(.68);
  panel(GAME_OVER_RECT, C.red, 1, 'rgba(10,4,8,.94)');
  tracked(game.endReason === 'invaded' ? 'THE INVASION SUCCEEDED' : 'SECTOR LOST', W / 2, 196, { size:9, tracking:3, color:C.red, align:'center' });
  const g = ctx.createLinearGradient(0, 218, 0, 260);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffc6e6');
  pText('GAME OVER', W / 2, 218, 6, g, { align:'center', glow:22, glowColor:C.red });
  const lg = ctx.createLinearGradient(W / 2 - 169, 0, W / 2 + 169, 0);
  lg.addColorStop(0, 'rgba(255,95,115,0)'); lg.addColorStop(.5, 'rgba(255,95,115,.55)'); lg.addColorStop(1, 'rgba(255,95,115,0)');
  ctx.fillStyle = lg; ctx.fillRect(W / 2 - 169, 272, 338, 1);
  pText('FINAL SCORE', W / 2, 299, 2, C.muted, { align:'center' });
  pText(pad(game.score, 6), W / 2, 321, 5, C.ink, { align:'center', glow:8, glowColor:C.cyan });
  pText('HI-SCORE ' + pad(game.hiScore, 6), W / 2, 373, 2, C.dim, { align:'center' });
  if (game.newHigh) pText('NEW HIGH SCORE', W / 2, 395, 2, C.amber, { align:'center', glow:10, glowColor:C.amberGlow });
  drawActionRow(GAME_OVER_PLAY_RECT, 'PLAY AGAIN', 'ENTER / SPACE', C.cyan);
  drawActionRow(GAME_OVER_TITLE_RECT, 'TITLE SCREEN', 'Q', C.cyanSoft, .82);
}
function drawWaveClear(){
  const R = WAVE_CLEAR_RECT;
  panel(R, C.mint, 1, 'rgba(3,10,12,.9)');
  tracked('SECTOR SECURED', W / 2, R.y + 30, { size:10, tracking:3, color:C.cyanSoft, align:'center' });
  pText('WAVE CLEARED', W / 2, R.y + 50, 4, C.ink, { align:'center', glow:14, glowColor:C.mint });
  pText('BONUS +' + game.waveBonus, W / 2, R.y + 104, 3, C.amber, { align:'center', glow:10, glowColor:C.amberGlow });
  const a = RM ? 1 : .55 + .45 * Math.sin(game.time * 6);
  tracked('NEXT WAVE INCOMING', W / 2, R.y + 172, { size:10, tracking:3, color:C.muted, align:'center', alpha:a });
}
function drawBanner(){
  const b = game.banner;
  let a = 1;
  if (b.t < .18) a = b.t / .18;
  else if (b.t > b.dur - .45) a = Math.max(0, (b.dur - b.t) / .45);
  const col = b.title === 'READY' ? C.mint : C.cyan;
  pText(b.title, W / 2, 392, 4, C.ink, { align:'center', glow:16, glowColor:col, alpha:a });
  if (b.subtitle) tracked(b.subtitle, W / 2, 440, { size:11, tracking:3, color:C.cyanSoft, align:'center', alpha:a });
}

/* ---------- cursor ---------- */
function interactiveRects(){
  switch (game.mode){
    case 'menu':
      if (resetConfirm) return [RESET_YES_RECT, RESET_NO_RECT];
      if (infoOpen) return [INFO_RESET_RECT];
      return [INFO_ICON_RECT];
    case 'paused': return [PAUSE_RESUME_RECT, PAUSE_TITLE_RECT];
    case 'gameover': return [GAME_OVER_PLAY_RECT, GAME_OVER_TITLE_RECT];
    default: return [];
  }
}
function updateCursor(){
  let c;
  if (hoverP && interactiveRects().some(r => inRect(hoverP, r))) c = 'pointer';
  else if (game.mode === 'paused' || game.mode === 'gameover' || (game.mode === 'menu' && (infoOpen || resetConfirm))) c = 'default';
  else c = 'crosshair';
  if (canvas.style.cursor !== c) canvas.style.cursor = c;
}

/* ---------- render ---------- */
function render(){
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
  drawBackground();
  const m = game.mode;
  if (m !== 'menu'){
    ctx.save();
    const s = game.shake * (RM ? .2 : 1);
    if (s > 0 && m !== 'paused') ctx.translate((Math.random() * 2 - 1) * s, (Math.random() * 2 - 1) * s);
    drawWorld();
    ctx.restore();
  }
  drawHUD();
  if (m === 'menu'){
    drawTitle();
    if (infoOpen) drawInfo(); else drawInfoIcon();
  } else if (m === 'paused') drawPause();
  else if (m === 'gameover') drawGameOver();
  else if (m === 'waveclear') drawWaveClear();
  if (game.banner && (m === 'playing' || m === 'dying')) drawBanner();
  updateCursor();
}

/* ---------- deck UI sync ---------- */
function syncUI(){
  btnSound.textContent = soundOn ? 'Sound on' : 'Sound off';
  btnSound.setAttribute('aria-pressed', String(soundOn));
  const paused = game.mode === 'paused';
  btnPause.textContent = paused ? 'Resume' : 'Pause';
  btnPause.setAttribute('aria-pressed', String(paused));
  btnPause.disabled = !(paused || pausable());
}

/* ---------- keyboard ---------- */
const MOVE_L = new Set(['ArrowLeft', 'a', 'A']);
const MOVE_R = new Set(['ArrowRight', 'd', 'D']);
const USED = new Set([' ', 'Enter', 'Escape', 'p', 'm', 'i', 'r', 'y', 'n', 'q']);
window.addEventListener('keydown', e => {
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (MOVE_L.has(k)){ e.preventDefault(); held.left = true; return; }
  if (MOVE_R.has(k)){ e.preventDefault(); held.right = true; return; }
  if ((k === ' ' || k === 'Enter') && tag === 'BUTTON') return;
  const lk = k.length === 1 ? k.toLowerCase() : k;
  if (!USED.has(lk)) return;
  e.preventDefault();
  if (lk === ' ' && pausable()) held.fire = true;
  if (e.repeat) return;
  initAudio();
  if (lk === 'm'){ toggleSound(); return; }
  const m = game.mode;
  if (m === 'menu'){
    if (resetConfirm){
      if (lk === 'y') doReset();
      else if (lk === 'n' || lk === 'Escape' || lk === ' ' || lk === 'Enter') cancelConfirm();
      return;
    }
    if (infoOpen){
      if (lk === 'r') openConfirm();
      else if (lk === 'Escape' || lk === ' ' || lk === 'Enter' || lk === 'i') closeInfo();
      return;
    }
    if (lk === 'i'){ openInfo(); return; }
    if (lk === ' ' || lk === 'Enter') startNewGame();
    return;
  }
  if (m === 'paused'){
    if (lk === 'p' || lk === 'Escape' || lk === 'Enter') resumeGame();
    else if (lk === 'q') quitToTitle();
    return;
  }
  if (m === 'gameover'){
    if (lk === ' ' || lk === 'Enter') startNewGame();
    else if (lk === 'q') quitToTitle();
    return;
  }
  if (pausable() && (lk === 'p' || lk === 'Escape')) pauseGame();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (MOVE_L.has(k)) held.left = false;
  else if (MOVE_R.has(k)) held.right = false;
  else if (k === ' ') held.fire = false;
});

/* ---------- pointer on canvas ---------- */
function toLogical(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  if (e.button !== 0) return;
  e.preventDefault();
  try { canvas.focus({ preventScroll:true }); } catch (_) {}
  initAudio();
  const p = toLogical(e);
  hoverP = p;
  const m = game.mode;
  if (m === 'menu'){
    if (resetConfirm){ if (inRect(p, RESET_YES_RECT)) doReset(); else cancelConfirm(); return; }
    if (infoOpen){ if (inRect(p, INFO_RESET_RECT)) openConfirm(); else closeInfo(); return; }
    if (inRect(p, INFO_ICON_RECT)){ openInfo(); return; }
    startNewGame();
    return;
  }
  if (m === 'paused'){
    if (inRect(p, PAUSE_RESUME_RECT)) resumeGame();
    else if (inRect(p, PAUSE_TITLE_RECT)) quitToTitle();
    return;
  }
  if (m === 'gameover'){
    if (inRect(p, GAME_OVER_PLAY_RECT)) startNewGame();
    else if (inRect(p, GAME_OVER_TITLE_RECT)) quitToTitle();
    return;
  }
  ptr.active = true; ptr.id = e.pointerId; ptr.x = p.x; ptr.fire = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  hoverP = toLogical(e);
  if (ptr.active && e.pointerId === ptr.id) ptr.x = hoverP.x;
});
function endPtr(e){
  if (e.pointerId === ptr.id){ ptr.active = false; ptr.fire = false; ptr.id = null; }
  if (e.pointerType !== 'mouse') hoverP = null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('lostpointercapture', endPtr);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !ptr.active) hoverP = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- touch deck ---------- */
function holdBtn(el, on, off){
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    on();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, () => off()));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdBtn(tLeft, () => { touch.left = true; }, () => { touch.left = false; });
holdBtn(tRight, () => { touch.right = true; }, () => { touch.right = false; });
holdBtn(tFire, () => {
  const m = game.mode;
  if (m === 'menu'){
    if (resetConfirm) cancelConfirm();
    else if (infoOpen) closeInfo();
    else startNewGame();
    return;
  }
  if (m === 'gameover'){ startNewGame(); return; }
  if (m === 'paused') return;
  touch.fire = true;
}, () => { touch.fire = false; });

/* ---------- deck buttons ---------- */
function refocus(e){ if (e.detail > 0){ try { canvas.focus({ preventScroll:true }); } catch (_) {} } }
btnSound.addEventListener('click', e => { initAudio(); toggleSound(); refocus(e); });
btnPause.addEventListener('click', e => {
  initAudio();
  if (game.mode === 'paused') resumeGame(); else pauseGame();
  refocus(e);
});

/* ---------- focus loss ---------- */
window.addEventListener('blur', () => { if (pausable()) pauseGame(); clearHeld(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (pausable()) pauseGame(); clearHeld(); } });

/* ---------- loop ---------- */
let last = performance.now(), uiMode = null;
function frame(now){
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  if (game.mode !== uiMode){ uiMode = game.mode; syncUI(); }
  requestAnimationFrame(frame);
}
syncUI();
requestAnimationFrame(frame);
})();
</script>
