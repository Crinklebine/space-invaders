  // =========================================================================
  // 13. Input handling (Keyboard, Pointer/Touch on canvas, Touch deck)
  // =========================================================================
  function clientToLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / (rect.width || 1)) * W,
      y: ((clientY - rect.top) / (rect.height || 1)) * H
    };
  }

  function updateCursor() {
    const pt = input.pointerPos;
    if (game.mode === 'menu') {
      if (infoOpen) {
        if (resetConfirm) {
          canvas.style.cursor = (inRect(pt, RESET_YES_RECT) || inRect(pt, RESET_NO_RECT)) ? 'pointer' : 'default';
        } else {
          canvas.style.cursor = inRect(pt, INFO_RESET_RECT) ? 'pointer' : 'default';
        }
      } else {
        canvas.style.cursor = inRect(pt, INFO_ICON_RECT) ? 'pointer' : 'crosshair';
      }
      return;
    }

    if (game.mode === 'paused') {
      canvas.style.cursor = (inRect(pt, PAUSE_RESUME_RECT) || inRect(pt, PAUSE_TITLE_RECT)) ? 'pointer' : 'default';
      return;
    }

    if (game.mode === 'gameover') {
      canvas.style.cursor = (inRect(pt, GAME_OVER_PLAY_RECT) || inRect(pt, GAME_OVER_TITLE_RECT)) ? 'pointer' : 'default';
      return;
    }

    canvas.style.cursor = 'crosshair';
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    ensureAudio();
    const pt = clientToLogical(e.clientX, e.clientY);
    input.pointerPos = pt;

    if (canvas.focus) {
      try { canvas.focus({ preventScroll: true }); } catch (_) {}
    }

    if (game.mode === 'menu') {
      if (infoOpen) {
        if (resetConfirm) {
          if (inRect(pt, RESET_YES_RECT)) confirmResetHighScore();
          else cancelResetConfirm();
        } else {
          if (inRect(pt, INFO_RESET_RECT)) openResetConfirm();
          else closeInfo();
        }
      } else {
        if (inRect(pt, INFO_ICON_RECT)) openInfo();
        else startNewGame();
      }
      return;
    }

    if (game.mode === 'paused') {
      if (inRect(pt, PAUSE_RESUME_RECT)) resumeGame();
      else if (inRect(pt, PAUSE_TITLE_RECT)) returnToTitle();
      return;
    }

    if (game.mode === 'gameover') {
      if (inRect(pt, GAME_OVER_PLAY_RECT)) startNewGame();
      else if (inRect(pt, GAME_OVER_TITLE_RECT)) returnToTitle();
      return;
    }

    if (game.mode === 'playing') {
      input.dragging = true;
      input.dragPointerId = e.pointerId;
      input.dragTargetX = clamp(pt.x, 34, W - 34);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      firePlayerBullet();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pt = clientToLogical(e.clientX, e.clientY);
    input.pointerPos = pt;
    if (input.dragging && e.pointerId === input.dragPointerId && game.mode === 'playing') {
      input.dragTargetX = clamp(pt.x, 34, W - 34);
    }
    updateCursor();
  });

  function stopCanvasDrag(e) {
    if (input.dragging && (e.pointerId === undefined || e.pointerId === input.dragPointerId)) {
      input.dragging = false;
      input.dragPointerId = null;
    }
  }

  canvas.addEventListener('pointerup', stopCanvasDrag);
  canvas.addEventListener('pointercancel', stopCanvasDrag);
  canvas.addEventListener('lostpointercapture', stopCanvasDrag);
  canvas.addEventListener('pointerleave', () => {
    input.pointerPos = { x: -999, y: -999 };
    updateCursor();
  });

  // Keyboard
  const USED_CODES = new Set([
    'ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD',
    'Space', 'Enter', 'KeyP', 'Escape',
    'KeyM', 'KeyI', 'KeyR', 'KeyY', 'KeyN', 'KeyQ'
  ]);

  window.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    if (active) {
      const tag = active.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || active.isContentEditable) return;
      if (tag === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;
    }

    if (USED_CODES.has(e.code)) {
      e.preventDefault();
    } else {
      return;
    }

    ensureAudio();

    // Movement holds
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      input.left = true;
      return;
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      input.right = true;
      return;
    }

    // Space while playing = continuous fire hold
    if (e.code === 'Space' && game.mode === 'playing') {
      input.fire = true;
      if (!e.repeat) firePlayerBullet();
      return;
    }

    // Ignore key repeat for all action keys
    if (e.repeat) return;

    if (e.code === 'KeyM') {
      toggleSound();
      return;
    }

    // Title + Info + Reset Confirm
    if (game.mode === 'menu') {
      if (infoOpen) {
        if (resetConfirm) {
          if (e.code === 'KeyY') confirmResetHighScore();
          else if (e.code === 'KeyN' || e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') {
            cancelResetConfirm();
          }
          return;
        }
        if (e.code === 'KeyR') openResetConfirm();
        else if (e.code === 'KeyI' || e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') {
          closeInfo();
        }
        return;
      }

      if (e.code === 'KeyI') {
        openInfo();
      } else if (e.code === 'Enter' || e.code === 'Space') {
        startNewGame();
      }
      return;
    }

    // Playing
    if (game.mode === 'playing') {
      if (e.code === 'KeyP' || e.code === 'Escape') {
        pauseGame();
      }
      return;
    }

    // Paused
    if (game.mode === 'paused') {
      if (e.code === 'KeyP' || e.code === 'Escape' || e.code === 'Enter') {
        resumeGame();
      } else if (e.code === 'KeyQ') {
        returnToTitle();
      }
      return;
    }

    // Game Over
    if (game.mode === 'gameover') {
      if (e.code === 'Enter' || e.code === 'Space') {
        startNewGame();
      } else if (e.code === 'KeyQ') {
        returnToTitle();
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    else if (e.code === 'Space') input.fire = false;
  });

  // Auto-pause on blur or hidden tab (never saves high score)
  window.addEventListener('blur', () => {
    clearHeldInput();
    if (game.mode === 'playing') pauseGame();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearHeldInput();
      if (game.mode === 'playing') pauseGame();
    }
  });

  // Deck buttons
  soundBtn.addEventListener('click', () => {
    toggleSound();
  });

  pauseBtn.addEventListener('click', () => {
    ensureAudio();
    if (game.mode === 'playing') pauseGame();
    else if (game.mode === 'paused') resumeGame();
  });

  // Touch deck buttons with pointer capture
  function bindTouchHold(btn, prop, onDownExtra) {
    let activeId = null;
    const release = (e) => {
      if (activeId !== null && (e.pointerId === undefined || e.pointerId === activeId)) {
        activeId = null;
        input[prop] = false;
        btn.classList.remove('active');
      }
    };
    btn.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      ensureAudio();
      activeId = e.pointerId;
      btn.classList.add('active');
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      if (onDownExtra && onDownExtra()) return;
      input[prop] = true;
    });
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);
  }

  bindTouchHold(touchLeft, 'touchLeft');
  bindTouchHold(touchRight, 'touchRight');
  bindTouchHold(touchFire, 'touchFire', () => {
    if (game.mode === 'menu') {
      if (infoOpen) {
        if (resetConfirm) cancelResetConfirm();
        else closeInfo();
      } else {
        startNewGame();
      }
      return true;
    }
    if (game.mode === 'gameover') {
      startNewGame();
      return true;
    }
    if (game.mode === 'paused') {
      return true;
    }
    if (game.mode === 'playing') {
      firePlayerBullet();
    }
    return false;
  });

  // =========================================================================
  // 14. Main loop
  // =========================================================================
  syncDeckUI();
  updateCursor();

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
