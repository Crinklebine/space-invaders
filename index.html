<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<title>Space Invaders — Last Line</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
  :root {
    --bg: #03050a;
    --panel: #090f1a;
    --line: #1e2d42;
    --muted: #7290a8;
    --ink: #e9fbff;
    --cyan: #77f5ff;
    --mint: #88ffc2;
    --pink: #ff64d4;
    --amber: #ffd166;
    --red: #ff5f73;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    min-height: 100dvh;
    margin: 0;
    padding: clamp(10px, 3vh, 28px) 16px;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font-family: var(--mono);
    background:
      radial-gradient(1100px 620px at 50% 10%, rgba(22, 67, 89, .38), transparent 68%),
      radial-gradient(800px 700px at 12% 100%, rgba(84, 22, 71, .22), transparent 70%),
      radial-gradient(900px 700px at 94% 78%, rgba(18, 59, 78, .2), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(118, 235, 255, .025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(118, 235, 255, .025) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse at 50% 48%, #000 5%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 48%, #000 5%, transparent 75%);
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .18;
    background-image: radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 1px),
                      radial-gradient(circle at 76% 64%, #8fe9ff 0 1px, transparent 1px),
                      radial-gradient(circle at 40% 82%, #ff9ce7 0 1px, transparent 1px);
    background-size: 280px 250px, 360px 310px, 420px 390px;
  }

  .cabinet {
    position: relative;
    width: min(820px, 94vw, calc((100dvh - 156px) * 7 / 8));
    padding: clamp(7px, 1vw, 12px);
    border: 1px solid #26364e;
    border-radius: 22px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.07), transparent 20%),
      linear-gradient(160deg, #121b2a 0%, #080d16 42%, #060a11 100%);
    box-shadow:
      0 38px 90px rgba(0, 0, 0, .72),
      0 3px 18px rgba(0, 0, 0, .65),
      inset 0 1px 0 rgba(255, 255, 255, .08),
      inset 0 -1px 0 rgba(0, 0, 0, .8);
  }
  .cabinet::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 0 0 42px rgba(72, 209, 255, .07), 0 0 80px rgba(255, 65, 197, .035);
  }

  .screen-shell {
    position: relative;
    padding: clamp(4px, .6vw, 8px);
    border-radius: 15px;
    background: linear-gradient(150deg, #05080d, #020306);
    border: 1px solid #172235;
    box-shadow: inset 0 0 30px #000, 0 1px 0 rgba(255,255,255,.04);
  }
  .screen {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    aspect-ratio: 7 / 8;
    border-radius: 10px;
    background: #02040a;
    box-shadow: inset 0 0 80px rgba(0,0,0,.82), 0 0 30px rgba(45, 217, 255, .04);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
    cursor: crosshair;
  }
  .screen:focus-within {
    box-shadow: inset 0 0 80px rgba(0,0,0,.82), 0 0 0 1px rgba(114,245,255,.35), 0 0 22px rgba(55,213,255,.12);
  }
  .fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .scanlines {
    background: repeating-linear-gradient(to bottom,
      rgba(0, 0, 0, .22) 0, rgba(0, 0, 0, .22) 1px,
      rgba(255, 255, 255, .018) 2px, transparent 3px);
    opacity: .7;
    mix-blend-mode: multiply;
  }
  .vignette {
    box-shadow: inset 0 0 45px 14px rgba(0, 0, 0, .68), inset 0 0 130px 24px rgba(0, 0, 0, .35);
    border-radius: inherit;
  }
  .glare {
    background: linear-gradient(122deg,
      rgba(255, 255, 255, .073) 0,
      rgba(255, 255, 255, .012) 16%,
      transparent 31%,
      transparent 76%,
      rgba(255, 255, 255, .018) 100%);
    opacity: .55;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(145, 242, 255, .055);
  }

  .deck {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 7px 1px;
    min-height: 46px;
  }
  .hints {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px 15px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    user-select: none;
  }
  .hint { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  kbd {
    min-width: 20px;
    padding: 3px 5px;
    border: 1px solid #2a3d55;
    border-bottom-color: #0a111b;
    border-radius: 4px;
    color: #b8d4e2;
    background: linear-gradient(#101a28, #0a111b);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 1px 1px rgba(0,0,0,.4);
    font: 9px/1.1 var(--mono);
    text-align: center;
  }
  .sys-buttons { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
  .btn {
    appearance: none;
    cursor: pointer;
    min-height: 30px;
    padding: 7px 11px;
    border: 1px solid #273b53;
    border-radius: 6px;
    color: #91adc1;
    background: linear-gradient(#0c1522, #080e17);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 2px 4px rgba(0,0,0,.3);
    font: 500 9px/1 var(--mono);
    letter-spacing: .13em;
    text-transform: uppercase;
    transition: color .15s, border-color .15s, background .15s, box-shadow .15s;
    user-select: none;
    touch-action: manipulation;
  }
  .btn:hover:not(:disabled), .btn:focus-visible {
    color: var(--ink);
    border-color: #4b7b96;
    background: linear-gradient(#102130, #0a1420);
    box-shadow: 0 0 16px rgba(89, 225, 255, .13), inset 0 1px 0 rgba(255,255,255,.07);
    outline: none;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .38; cursor: default; }
  .sound-btn::before {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    margin-right: 7px;
    border-radius: 50%;
    vertical-align: 1px;
    background: var(--mint);
    box-shadow: 0 0 7px var(--mint);
    opacity: .9;
  }
  .sound-btn[aria-pressed="false"]::before { background: #4a5b6c; box-shadow: none; }

  .touch-deck {
    display: none;
    grid-template-columns: 2fr 1fr;
    gap: 8px;
    padding: 7px 5px 1px;
  }
  .touch-move { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .touch-btn {
    appearance: none;
    height: 48px;
    border: 1px solid #2a4059;
    border-radius: 9px;
    color: #a4c6d7;
    background: linear-gradient(#101b2b, #070d15);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 10px rgba(0,0,0,.35);
    font: 600 18px/1 var(--mono);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: background .06s, border-color .06s, transform .06s;
  }
  .touch-btn.fire {
    color: var(--mint);
    font-size: 10px;
    letter-spacing: .18em;
    border-color: #2c554a;
    background: linear-gradient(rgba(41, 110, 82, .27), rgba(7, 16, 18, .8));
  }
  .touch-btn.active, .touch-btn:active {
    transform: translateY(1px);
    color: #fff;
    border-color: var(--cyan);
    background: linear-gradient(rgba(33, 107, 126, .5), rgba(7, 19, 26, .9));
    box-shadow: 0 0 18px rgba(91, 233, 255, .18), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (hover: none), (pointer: coarse) {
    body { padding: 8px; }
    .cabinet { width: min(100vw - 16px, 760px, calc((100dvh - 158px) * 7 / 8)); border-radius: 16px; }
    .deck { padding-top: 8px; }
    .hints { display: none; }
    .sys-buttons { width: 100%; justify-content: flex-end; }
    .touch-deck { display: grid; }
  }
  @media (max-height: 500px) and (pointer: coarse) {
    body { padding: 5px; }
    .cabinet { width: min(100vw - 10px, calc((100dvh - 128px) * 7 / 8)); padding: 5px; }
    .screen-shell { padding: 3px; }
    .deck { min-height: 32px; padding: 4px 4px 0; }
    .btn { min-height: 26px; padding: 5px 8px; }
    .touch-deck { padding-top: 4px; gap: 6px; }
    .touch-btn { height: 40px; }
    .touch-move { gap: 6px; }
  }
  @media (max-width: 520px) {
    .cabinet { width: min(calc(100vw - 12px), calc((100dvh - 128px) * 7 / 8)); padding: 5px; }
    .screen-shell { padding: 4px; }
    .btn { padding: 6px 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
    .fx { opacity: .65; }
  }
</style>
<script
  data-goatcounter="https://crink.goatcounter.com/count"
  async
  src="//gc.zgo.at/count.js"
></script>
</head>
<body>
<main class="cabinet" aria-label="Space Invaders arcade cabinet">
  <div class="screen-shell">
    <div class="screen">
      <canvas id="game" width="1260" height="1440" tabindex="0" role="application"
        aria-label="Space Invaders. Move with the arrow keys or A and D. Fire with Space. Pause with P. Press Enter to start."
        aria-keyshortcuts="Enter Space ArrowLeft ArrowRight A D P M"></canvas>
      <div class="fx scanlines" aria-hidden="true"></div>
      <div class="fx glare" aria-hidden="true"></div>
      <div class="fx vignette" aria-hidden="true"></div>
    </div>
  </div>

  <div class="deck">
    <div class="hints" aria-hidden="true">
      <span class="hint"><kbd>←</kbd><kbd>→</kbd> Move</span>
      <span class="hint"><kbd>Space</kbd> Fire</span>
      <span class="hint"><kbd>P</kbd> Pause</span>
      <span class="hint"><kbd>M</kbd> Sound</span>
    </div>
    <div class="sys-buttons">
      <button class="btn sound-btn" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      <button class="btn" id="pauseBtn" type="button" aria-label="Pause game" disabled>Pause</button>
    </div>
  </div>

  <div class="touch-deck" aria-label="Touch controls">
    <div class="touch-move">
      <button class="touch-btn" id="leftBtn" type="button" aria-label="Move left" data-hold="left">◀</button>
      <button class="touch-btn" id="rightBtn" type="button" aria-label="Move right" data-hold="right">▶</button>
    </div>
    <button class="touch-btn fire" id="fireBtn" type="button" aria-label="Fire" data-hold="fire">Fire</button>
  </div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</main>

<script>
(() => {
'use strict';

/* ---------- build stamp ---------- */
const BUILD_HASH = (() => {
  const src = [...document.querySelectorAll('style, script')].map(el => el.textContent).join('\n');
  let h = 0x811c9dc5;
  for (let i = 0; i < src.length; i++) {
    h ^= src.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7);
})();
const BUILD_DATE = (() => {
  const d = new Date(document.lastModified);
  if (Number.isNaN(d.getTime()) || d.getFullYear() < 2000) return 'UNKNOWN';
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
})();
const PAGE_NAME = decodeURIComponent(location.pathname.split('/').pop() || 'index.html');

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 630, H = 720, RS = 2;
canvas.width = W * RS;
canvas.height = H * RS;
ctx.scale(RS, RS);
ctx.imageSmoothingEnabled = false;

const C = {
  ink: '#eaffff', muted: '#6f8da3', dim: '#405a6d',
  cyan: '#75f4ff', cyanSoft: '#2baac7',
  mint: '#8dffc4', green: '#46e69a', greenGlow: '#25ff9c',
  pink: '#ff67d8', pinkGlow: '#ff2bb8',
  amber: '#ffd166', amberGlow: '#ff9d25',
  red: '#ff5f73', redGlow: '#ff2348',
  white: '#ffffff', black: '#02040a'
};
const FONT = '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, ui-monospace, monospace';
const TAU = Math.PI * 2;
const GROUND_Y = 678;
const DANGER_Y = 574;
const UFO_DEFLECTOR_CHANCE = .1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pad2 = n => String(n).padStart(2, '0');
const padScore = n => String(n).padStart(6, '0');
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
const easeOut = t => 1 - Math.pow(1 - t, 3);
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- tiny 5x7 arcade alphabet ---------- */
const GLYPHS = {
  A:['01110','10001','10001','11111','10001','10001','10001'],
  B:['11110','10001','10001','11110','10001','10001','11110'],
  C:['01111','10000','10000','10000','10000','10000','01111'],
  D:['11110','10001','10001','10001','10001','10001','11110'],
  E:['11111','10000','10000','11110','10000','10000','11111'],
  F:['11111','10000','10000','11110','10000','10000','10000'],
  G:['01111','10000','10000','10111','10001','10001','01111'],
  H:['10001','10001','10001','11111','10001','10001','10001'],
  I:['11111','00100','00100','00100','00100','00100','11111'],
  J:['00111','00010','00010','00010','00010','10010','01100'],
  K:['10001','10010','10100','11000','10100','10010','10001'],
  L:['10000','10000','10000','10000','10000','10000','11111'],
  M:['10001','11011','10101','10101','10001','10001','10001'],
  N:['10001','11001','10101','10011','10001','10001','10001'],
  O:['01110','10001','10001','10001','10001','10001','01110'],
  P:['11110','10001','10001','11110','10000','10000','10000'],
  Q:['01110','10001','10001','10001','10101','10010','01101'],
  R:['11110','10001','10001','11110','10100','10010','10001'],
  S:['01111','10000','10000','01110','00001','00001','11110'],
  T:['11111','00100','00100','00100','00100','00100','00100'],
  U:['10001','10001','10001','10001','10001','10001','01110'],
  V:['10001','10001','10001','10001','10001','01010','00100'],
  W:['10001','10001','10001','10101','10101','11011','10001'],
  X:['10001','10001','01010','00100','01010','10001','10001'],
  Y:['10001','10001','01010','00100','00100','00100','00100'],
  Z:['11111','00001','00010','00100','01000','10000','11111'],
  0:['01110','10001','10011','10101','11001','10001','01110'],
  1:['00100','01100','00100','00100','00100','00100','01110'],
  2:['01110','10001','00001','00010','00100','01000','11111'],
  3:['11111','00010','00100','00010','00001','10001','01110'],
  4:['00010','00110','01010','10010','11111','00010','00010'],
  5:['11111','10000','11110','00001','00001','10001','01110'],
  6:['00110','01000','10000','11110','10001','10001','01110'],
  7:['11111','00001','00010','00100','01000','01000','01000'],
  8:['01110','10001','10001','01110','10001','10001','01110'],
  9:['01110','10001','10001','01111','00001','00010','01100'],
  ' ':['00000','00000','00000','00000','00000','00000','00000'],
  '-':['00000','00000','00000','11111','00000','00000','00000'],
  '.':['00000','00000','00000','00000','00000','00110','00110'],
  ':':['00000','00110','00110','00000','00110','00110','00000'],
  '/':['00001','00010','00010','00100','01000','01000','10000'],
  '+':['00000','00100','00100','11111','00100','00100','00000'],
  '!':['00100','00100','00100','00100','00100','00000','00100'],
  '?':['01110','10001','00001','00010','00100','00000','00100']
};
function pTextWidth(str, size, spacing = 1) {
  return String(str).length * 5 * size + Math.max(0, String(str).length - 1) * spacing * size;
}
function pText(str, x, y, size, color, opts = {}) {
  const spacing = opts.spacing ?? 1;
  const chars = [...String(str).toUpperCase()];
  const width = pTextWidth(chars.join(''), size, spacing);
  let sx = opts.align === 'center' ? x - width / 2 : opts.align === 'right' ? x - width : x;
  const path = new Path2D();
  chars.forEach((ch, i) => {
    const glyph = GLYPHS[ch] || GLYPHS['?'];
    for (let row = 0; row < 7; row++) {
      for (let col = 0; col < 5; col++) {
        if (glyph[row][col] === '1') path.rect(sx + i * (5 + spacing) * size + col * size, y + row * size, size, size);
      }
    }
  });
  ctx.save();
  ctx.globalAlpha = opts.alpha ?? 1;
  ctx.fillStyle = color;
  if (opts.glow) { ctx.shadowColor = opts.glowColor || color; ctx.shadowBlur = opts.glow; }
  ctx.fill(path);
  ctx.restore();
  return width;
}
function tracked(str, x, y, opts = {}) {
  const size = opts.size ?? 11, spacing = opts.tracking ?? 2;
  const chars = [...String(str)];
  ctx.save();
  ctx.font = `${opts.weight || 500} ${size}px ${FONT}`;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = opts.color || C.muted;
  ctx.globalAlpha = opts.alpha ?? 1;
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + Math.max(0, chars.length - 1) * spacing;
  let sx = opts.align === 'center' ? x - total / 2 : opts.align === 'right' ? x - total : x;
  chars.forEach((ch, i) => { ctx.fillText(ch, sx, y); sx += widths[i] + spacing; });
  ctx.restore();
  return total;
}
function line(x1, y1, x2, y2, color, width = 1) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function cutPath(x, y, w, h, cut = 12) {
  const p = new Path2D();
  p.moveTo(x + cut, y); p.lineTo(x + w - cut, y); p.lineTo(x + w, y + cut);
  p.lineTo(x + w, y + h - cut); p.lineTo(x + w - cut, y + h); p.lineTo(x + cut, y + h);
  p.lineTo(x, y + h - cut); p.lineTo(x, y + cut); p.closePath();
  return p;
}
function panel(x, y, w, h, accent, alpha = 1) {
  const p = cutPath(x, y, w, h, 13);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(8,17,28,.94)');
  g.addColorStop(1, 'rgba(2,6,12,.96)');
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g; ctx.fill(p);
  ctx.shadowColor = accent; ctx.shadowBlur = 14;
  ctx.strokeStyle = rgba(accent, .42); ctx.lineWidth = 1;
  ctx.stroke(p);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = rgba(accent, .7); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 18, y); ctx.lineTo(x + 58, y);
  ctx.moveTo(x + w - 18, y + h); ctx.lineTo(x + w - 58, y + h);
  ctx.stroke();
  ctx.restore();
}
function dim(a = .62) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, W * .7);
  g.addColorStop(0, `rgba(1,4,9,${a * .72})`);
  g.addColorStop(1, `rgba(1,4,9,${Math.min(.92, a + .2)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- sprites ---------- */
const PATTERNS = {
  squid: [[
    '..XXXX..', '.XXXXXX.', 'XX.XX.XX', 'XXXXXXXX',
    '.X.XX.X.', 'X.X..X.X', 'X.X..X.X', '...XX...'
  ],[
    '..XXXX..', '.XXXXXX.', 'XX.XX.XX', 'XXXXXXXX',
    '.X.XX.X.', '..X..X..', '.X.XX.X.', 'X......X'
  ]],
  crab: [[
    '..X.....X..', '...X...X...', '..XXXXXXX..', '.XX.XXX.XX.',
    'XXXXXXXXXXX', 'X.XXXXXXX.X', 'X.X.....X.X', '...XX.XX...'
  ],[

function makeSprite(rows, color, glow, opts = {}) {

const B_COLS = 24, B_ROWS = 17, B_CELL = 3, B_W = B_COLS * B_CELL, B_H = B_ROWS * B_CELL;

}

    const b = {
      x: Math.round(gap + i * (B_W + gap)), y: 500,
      w: B_W, h: B_H, cell: B_CELL, grid: buildBunkerShape(),

}

  }

      base.rect(x * B_CELL, y * B_CELL, B_CELL, B_CELL);
      if (y === 0 || !b.grid[(y - 1) * B_COLS + x]) tops.rect(x * B_CELL, y * B_CELL, B_CELL, 1);
      if ((x * 7 + y * 11) % 13 === 0) flecks.rect(x * B_CELL + 1, y * B_CELL + 1, 1, 1);

  g.fill(base);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(190,255,218,.67)'; g.fill(tops);
  g.fillStyle = 'rgba(4,36,22,.35)'; g.fill(flecks);
}

/* ---------- collisions ---------- */
function bunkerHitAt(x, y, w, h) {
  for (const b of bunkers) {
    if (x + w < b.x || x > b.x + b.w || y + h < b.y || y > b.y + b.h) continue;
    const gx0 = clamp(Math.floor((x - b.x) / B_CELL), 0, B_COLS - 1);
    const gx1 = clamp(Math.floor((x + w - b.x) / B_CELL), 0, B_COLS - 1);
    const gy0 = clamp(Math.floor((y - b.y) / B_CELL), 0, B_ROWS - 1);
    const gy1 = clamp(Math.floor((y + h - b.y) / B_CELL), 0, B_ROWS - 1);
    for (let gy = gy0; gy <= gy1; gy++) {
      for (let gx = gx0; gx <= gx1; gx++) {
        if (b.grid[gy * B_COLS + gx]) return { bunker: b, gx, gy };
      }
    }
  }
  return null;
}
function damageBunker(b, px, py, radius, color = C.mint, up = true) {
  let removed = 0;
  const cx = clamp((px - b.x) / B_CELL, 0, B_COLS - 1);
  const cy = clamp((py - b.y) / B_CELL, 0, B_ROWS - 1);
  const reach = Math.ceil(radius / B_CELL) + 1;
  for (let gy = Math.floor(cy) - reach; gy <= Math.floor(cy) + reach; gy++) {
    for (let gx = Math.floor(cx) - reach; gx <= Math.floor(cx) + reach; gx++) {
      if (gx < 0 || gx >= B_COLS || gy < 0 || gy >= B_ROWS) continue;
      if (!b.grid[gy * B_COLS + gx]) continue;
      const dx = gx + .5 - cx, dy = gy + .5 - cy;
      if (Math.hypot(dx, dy) < radius / B_CELL * rand(.78, 1.15)) {
        b.grid[gy * B_COLS + gx] = 0;
        removed++;
        if (removed < 15 && Math.random() < .45) {
          particles.push({
            x: b.x + gx * B_CELL + 1.5, y: b.y + gy * B_CELL + 1.5,
            vx: rand(-70, 70), vy: up ? rand(10, 95) : rand(-95, -10),
            life: rand(.18, .5), max: .5, size: rand(1, 2.4),
            color: Math.random() < .3 ? C.white : color, gravity: 160, drag: .98

function crushBunkers() {

    if (!inv.alive) continue;
    const ix = formation.x + inv.offX, iy = formation.y + inv.offY;
    for (const b of bunkers) {
      if (ix + inv.w < b.x || ix > b.x + b.w || iy + inv.h < b.y || iy > b.y + b.h) continue;
      for (let gy = 0; gy < B_ROWS; gy++) {
        for (let gx = 0; gx < B_COLS; gx++) {
          if (!b.grid[gy * B_COLS + gx]) continue;
          const px = b.x + gx * B_CELL + 1.5, py = b.y + gy * B_CELL + 1.5;
          if (px > ix - 4 && px < ix + inv.w + 4 && py > iy - 2 && py < iy + inv.h + 3) {
            b.grid[gy * B_COLS + gx] = 0;
            if (Math.random() < .07 && particles.length < 580) {
              particles.push({ x: px, y: py, vx: rand(-30, 30), vy: rand(-70, 5), life: .4, max: .4, size: 1.7, color: C.green, gravity: 130, drag: .98 });
            }

}
function invaderBounds() {

  for (const inv of invaders) {
    if (!inv.alive) continue;
    const x = formation.x + inv.offX, y = formation.y + inv.offY;
    if (x < minX) minX = x;
    if (x + inv.w > maxX) maxX = x + inv.w;

function updateFormation(dt) {

  ctx.globalCompositeOperation = 'lighter';
  for (const b of foeBullets) {
    const cx = b.x + b.w / 2;
    const top = b.y - 3;
    const seg = (b.h + 6) / 5;
    /* Flip the zigzag on alternating animation frames, like the arcade bombs. */
    const frame = reduceMotion ? 0 : Math.floor(game.time * 12 + b.phase) % 2;
    const dir = frame ? 1 : -1;
    ctx.globalAlpha = .14;
    ctx.fillStyle = C.red;
    ctx.fillRect(cx - 5, top - 2, 10, b.h + 8);
    ctx.globalAlpha = 1;
    ctx.shadowColor = C.redGlow; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff8998';
    for (let i = 0; i < 5; i++) {
      const px = cx + (i % 2 === 0 ? -1.7 : 1.7) * dir;
      ctx.fillRect(px - 1.4, top + i * seg, 2.8, seg + .7);
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff0ef';
    for (let i = 1; i < 5; i += 2) {
      const px = cx + (i % 2 === 0 ? -1.7 : 1.7) * dir;
      ctx.fillRect(px - .6, top + i * seg + .6, 1.2, seg - 1.2);
    }
  }
  ctx.restore();
}
function drawUfoShip() {
  if (!ufo) return;
  const bob = reduceMotion ? 0 : Math.sin(game.time * 4.4) * 2;
  const cx = ufo.x + ufo.w / 2;
  const cy = ufo.y + ufo.h / 2 + bob;
  drawSprite(SPRITES.ufo, ufo.x, ufo.y + bob, 1, .97);
  if (ufo.shield > 0) {
    const t = 1 - ufo.shield / .55;
    const fade = 1 - t;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPRITES.ufo, ufo.x, ufo.y + bob, 1, fade * .5);
    ctx.globalAlpha = fade * .9;
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 14 + t * 56, 7 + t * 30, 0, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = fade * .6;
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 8 + t * 42, 4 + t * 22, 0, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = fade;
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 30 + t * 16, 17 + t * 9, 0, .1 * Math.PI, .9 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }
  if (ufo.deflector && ufo.hits > 0) {
    const pulse = reduceMotion ? .55 : .45 + Math.sin(game.time * 8) * .15;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.2;
    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 8;
    ctx.setLineDash([4, 7]);
    ctx.lineDashOffset = reduceMotion ? 0 : -game.time * 30;
    ctx.beginPath();
    ctx.ellipse(cx, cy, ufo.w / 2 + 11, ufo.h / 2 + 10, 0, .08 * Math.PI, .92 * Math.PI);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = pulse * .5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, ufo.w / 2 + 6, ufo.h / 2 + 6, 0, .16 * Math.PI, .84 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const on = (Math.floor(game.time * 10) + i) % 3 === 0;
    ctx.globalAlpha = on ? .95 : .2;
    ctx.fillStyle = i % 2 ? C.pink : C.cyan;
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 9;
    ctx.fillRect(ufo.x + 9 + i * 8, ufo.y + 20 + bob, 2, 2);
  }
  ctx.restore();
}
function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    if (p.size > 2.7) {
      ctx.globalAlpha = a * .32;
      ctx.fillRect(p.x - p.size, p.y - 1, p.size * 2, 2);
      ctx.fillRect(p.x - 1, p.y - p.size, 2, p.size * 2);
    }
  }
  ctx.globalAlpha = 1;
  ctx.lineCap = 'round';
  for (const r of ricochets) {
    const a = clamp(r.life / r.max, 0, 1);
    const sp = Math.hypot(r.vx, r.vy) || 1;
    const len = clamp(sp * .065, 9, 30);
    const dx = r.vx / sp * len, dy = r.vy / sp * len;
    ctx.globalAlpha = a;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.width;
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(r.x - dx, r.y - dy);
    ctx.lineTo(r.x, r.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.white;
    ctx.fillRect(r.x - r.head / 2, r.y - r.head / 2, r.head, r.head);
  }
  for (const r of rings) {
    const t = 1 - r.life / r.max;
    const rad = r.from + (r.to - r.from) * easeOut(t);
    ctx.globalAlpha = (1 - t) * .55;
    ctx.strokeStyle = r.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawFloaters() {
  for (const f of floaters) {
    const a = clamp(f.life / f.max, 0, 1);
    pText(f.text, f.x, f.y, 2, f.color, { align: 'center', alpha: Math.min(1, a * 1.7), glow: 8 });
  }
}
function drawWorld() {
  const shake = reduceMotion ? game.shake * .2 : game.shake;
  ctx.save();
  if (shake > .15) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawBunkers();
  for (const inv of invaders) {
    if (!inv.alive) continue;
    drawSprite(SPRITES.invaders[inv.type][formation.frame],
      formation.x + inv.offX, formation.y + inv.offY);
  }
  drawUfoShip();
  drawEnemyBullets();
  drawPlayerShip();
  drawPlayerBullets();
  drawParticles();
  drawFloaters();
  ctx.restore();
  if (game.damageFlash > 0) {
    ctx.fillStyle = `rgba(255,47,76,${game.damageFlash * .18})`;
    ctx.fillRect(0, 0, W, H);
  }
}
/* ---------- rendering: HUD, title, overlays ---------- */
function drawHUD() {
  const top = ctx.createLinearGradient(0, 0, 0, 88);
  top.addColorStop(0, 'rgba(2,7,13,.94)');
  top.addColorStop(.74, 'rgba(2,7,13,.78)');
  top.addColorStop(1, 'rgba(2,7,13,0)');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 88);

  pText('SCORE', 34, 19, 2, C.muted, { spacing: 1 });
  pText(padScore(game.score), 34, 40, 3, C.ink, { glow: 2 });
  pText('HI-SCORE', W / 2, 19, 2, C.muted, { align: 'center', spacing: 1 });
  pText(padScore(game.hiScore), W / 2, 40, 3, game.newHigh ? C.amber : C.ink, { align: 'center', glow: game.newHigh ? 8 : 0, glowColor: C.amberGlow });
  pText('WAVE', W - 34, 19, 2, C.muted, { align: 'right' });
  pText(pad2(game.wave), W - 34, 40, 3, C.cyan, { align: 'right', glow: 4 });

  const hline = ctx.createLinearGradient(24, 0, W - 24, 0);
  hline.addColorStop(0, 'rgba(94,226,255,0)');
  hline.addColorStop(.18, 'rgba(94,226,255,.22)');
  hline.addColorStop(.5, 'rgba(128,244,255,.55)');
  hline.addColorStop(.82, 'rgba(255,103,216,.25)');
  hline.addColorStop(1, 'rgba(255,103,216,0)');
  ctx.fillStyle = hline; ctx.fillRect(24, 78, W - 48, 1);

  const bottom = ctx.createLinearGradient(0, 668, 0, H);
  bottom.addColorStop(0, 'rgba(2,6,12,0)');
  bottom.addColorStop(.32, 'rgba(2,6,12,.72)');
  bottom.addColorStop(1, 'rgba(2,6,12,.96)');
  ctx.fillStyle = bottom; ctx.fillRect(0, 668, W, H - 668);
  const bline = ctx.createLinearGradient(24, 0, W - 24, 0);
  bline.addColorStop(0, 'rgba(104,235,255,0)');
  bline.addColorStop(.28, 'rgba(104,235,255,.2)');
  bline.addColorStop(.72, 'rgba(104,235,255,.2)');
  bline.addColorStop(1, 'rgba(104,235,255,0)');
  ctx.fillStyle = bline; ctx.fillRect(24, GROUND_Y, W - 48, 1);

  pText('LIVES', 34, 695, 2, C.muted);
  const shown = Math.min(5, game.lives);
  for (let i = 0; i < shown; i++) {
    drawSprite(SPRITES.ship, 119 + i * 29, 694, .55, .94);
  }
  pText('CREDIT 01', W - 34, 695, 2, C.dim, { align: 'right' });
}

function decorativeLine(y, width, color) {
  const grad = ctx.createLinearGradient(W / 2 - width / 2, 0, W / 2 + width / 2, 0);
  grad.addColorStop(0, rgba(color, 0));
  grad.addColorStop(.5, rgba(color, .58));
  grad.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = grad;
  ctx.fillRect(W / 2 - width / 2, y, width, 1);
}
function drawMenu() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(W / 2, 290, 30, W / 2, 290, 430);
  halo.addColorStop(0, 'rgba(27,123,149,.1)');
  halo.addColorStop(.5, 'rgba(74,37,112,.045)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 80, W, 530);
  ctx.restore();

  const ex = tracked('EARTH DEFENSE INITIATIVE', W / 2, 118, { align: 'center', size: 10, tracking: 3, color: C.cyanSoft });
  line(W / 2 - ex / 2 - 58, 118, W / 2 - ex / 2 - 16, 118, rgba(C.cyan, .3));
  line(W / 2 + ex / 2 + 16, 118, W / 2 + ex / 2 + 58, 118, rgba(C.cyan, .3));

  const spaceGrad = ctx.createLinearGradient(0, 154, 0, 245);
  spaceGrad.addColorStop(0, '#ffffff');
  spaceGrad.addColorStop(.5, '#e8ffff');
  spaceGrad.addColorStop(1, '#8fe9fb');
  const invGrad = ctx.createLinearGradient(0, 260, 0, 351);
  invGrad.addColorStop(0, '#fff7fd');
  invGrad.addColorStop(.45, '#ffd7f4');
  invGrad.addColorStop(1, '#ff78d8');
  pText('SPACE', W / 2, 154, 12, spaceGrad, { align: 'center', glow: 24, glowColor: '#19c7ef' });
  pText('INVADERS', W / 2, 260, 12, invGrad, { align: 'center', glow: 24, glowColor: C.pinkGlow });
  decorativeLine(382, 430, C.cyan);
  tracked('THE CLASSIC BATTLE FOR EARTH', W / 2, 402, { align: 'center', size: 10, tracking: 3.2, color: C.muted });

  panel(W / 2 - 205, 430, 410, 64, C.cyan, .92);
  const pulse = reduceMotion ? .9 : .68 + Math.sin(game.time * 4.7) * .32;
  pText('PRESS ENTER TO START', W / 2, 444, 2, '#eaffff', { align: 'center', alpha: pulse, glow: 8, glowColor: C.cyan });
  tracked('OR CLICK / TAP ANYWHERE', W / 2, 474, { align: 'center', size: 9, tracking: 2, color: C.muted });

  tracked('MOVE WITH ARROWS OR DRAG   /   FIRE WITH SPACE', W / 2, 521, { align: 'center', size: 9, tracking: 1.5, color: C.dim });

  tracked('TARGETS', W / 2, 553, { align: 'center', size: 8, tracking: 3, color: C.dim });
  const cast = [W / 2 - 180, W / 2 - 60, W / 2 + 60];
  ENEMY_TYPES.forEach((type, i) => {
    const spr = SPRITES.invaders[i][Math.floor(game.time * 2) % 2];
    drawSprite(spr, cast[i] - spr.w / 2, 568, 1, .94);
    pText(`${type.points} PTS`, cast[i], 600, 2, type.color, { align: 'center', alpha: .8 });
  });
  const ufoX = W / 2 + 180;
  const ufoSpr = SPRITES.ufo;
  drawSprite(ufoSpr, ufoX - ufoSpr.w / 2, 568, .9, .8);
  pText('MYSTERY', ufoX, 600, 2, C.red, { align: 'center', alpha: .65 });
}

function drawInfo() {
  dim(.84);
  const x = 45, y = 160, w = W - 90, h = 370;
  ctx.save();
  ctx.fillStyle = 'rgba(2,6,12,.92)';
  ctx.fill(cutPath(x, y, w, h, 13));
  ctx.restore();
  panel(x, y, w, h, C.mint, 1);
  const scale = clamp(W / (canvas.getBoundingClientRect().width || W), 1, 1.75);
  const headSize = 10 * scale, rowSize = 10 * scale, footSize = 9 * scale;
  tracked('SPACE INVADERS // SYSTEM INFO', x + 30, y + 36, { size: headSize, tracking: 2.2 * scale, color: C.mint });
  line(x + 30, y + 56, x + w - 30, y + 56, rgba(C.mint, .26));
  const rows = [
    ['PAGE', PAGE_NAME, C.ink],
    ['BUILD', BUILD_HASH, C.cyan],
    ['BUILT', BUILD_DATE, C.ink],
    ['RES', `${innerWidth} × ${innerHeight} @ ${devicePixelRatio || 1}x`, C.ink],
    ['ARCADE BEST', padScore(game.hiScore), game.hiScore > 0 ? C.amber : C.muted]
  ];
  rows.forEach(([label, value, color], i) => {
    const ry = y + 88 + i * 38;
    tracked(label, x + 30, ry, { size: rowSize, tracking: 1.8 * scale, color: C.muted });
    tracked(value, x + w - 30, ry, { size: rowSize, tracking: .6 * scale, color, align: 'right' });
  });
  line(x + 30, y + h - 66, x + w - 30, y + h - 66, rgba(C.mint, .18));
  tracked('PRESS I OR TAP TO CLOSE', W / 2, y + h - 34, { align: 'center', size: footSize, tracking: 2.2 * scale, color: C.muted });
}

function drawBanner() {
  if (!game.banner) return;
  const b = game.banner;
  const fadeIn = clamp((b.max - b.t) / .18, 0, 1);
  const fadeOut = clamp(b.t / .45, 0, 1);
  const a = Math.min(fadeIn, fadeOut);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  const grad = ctx.createLinearGradient(0, 310, 0, 386);
  grad.addColorStop(0, 'rgba(2,7,12,0)');
  grad.addColorStop(.5, 'rgba(2,7,12,.56)');
  grad.addColorStop(1, 'rgba(2,7,12,0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 310, W, 76);
  decorativeLine(328, 438, C.cyan);
  pText(b.title, W / 2, 331, 5, C.ink, { align: 'center', glow: 16, glowColor: C.cyan, alpha: a });
  if (b.sub) tracked(b.sub, W / 2, 379, { align: 'center', size: 10, tracking: 2.4, color: '#a9c4d4', alpha: a });
  ctx.restore();
}
function drawPause() {
  dim(.55);
  panel((W - 500) / 2, 258, 500, 226, C.cyan, 1);
  tracked('SYSTEM HALTED', W / 2, 292, { align: 'center', size: 9, tracking: 3.2, color: C.cyanSoft });
  pText('PAUSED', W / 2, 315, 6, C.ink, { align: 'center', glow: 18, glowColor: C.cyan });
  decorativeLine(388, 300, C.cyan);
  tracked('PRESS P OR ESC TO RESUME', W / 2, 411, { align: 'center', size: 10, tracking: 2, color: C.ink });
  tracked('CLICK / TAP TO CONTINUE', W / 2, 438, { align: 'center', size: 9, tracking: 2, color: C.muted });
}
function drawGameOver() {
  dim(.68);
  panel((W - 520) / 2, 218, 520, 360, C.red, 1);
  const reason = game.endReason === 'invaded' ? 'THE INVASION SUCCEEDED' : 'SECTOR LOST';
  tracked(reason, W / 2, 254, { align: 'center', size: 9, tracking: 3, color: C.red });
  pText('GAME OVER', W / 2, 276, 6, '#fff1f4', { align: 'center', glow: 22, glowColor: C.redGlow });
  decorativeLine(338, 330, C.red);
  pText('FINAL SCORE', W / 2, 357, 2, C.muted, { align: 'center' });
  pText(padScore(game.score), W / 2, 379, 5, C.ink, { align: 'center', glow: 8, glowColor: C.cyan });
  pText(`HI-SCORE ${padScore(game.hiScore)}`, W / 2, 431, 2, C.dim, { align: 'center' });
  if (game.newHigh) {
    pText('NEW HIGH SCORE', W / 2, 453, 2, C.amber, { align: 'center', glow: 10, glowColor: C.amberGlow });
  }
  const blink = reduceMotion ? 1 : .66 + Math.sin(game.time * 4) * .34;
  pText('PRESS ENTER TO PLAY AGAIN', W / 2, 489, 2, C.ink, { align: 'center', alpha: blink });
  tracked('CLICK OR TAP TO RESTART', W / 2, 524, { align: 'center', size: 9, tracking: 2.1, color: C.muted });
}
function drawWaveClear() {
  dim(.46);
  panel((W - 500) / 2, 260, 500, 208, C.mint, 1);
  tracked('SECTOR SECURED', W / 2, 291, { align: 'center', size: 9, tracking: 3, color: C.mint });
  pText('WAVE CLEARED', W / 2, 313, 4, C.ink, { align: 'center', glow: 14, glowColor: C.greenGlow });
  decorativeLine(361, 300, C.mint);
  pText(`BONUS +${game.waveBonus}`, W / 2, 380, 2, C.amber, { align: 'center', glow: 6, glowColor: C.amberGlow });
  tracked('NEXT WAVE INCOMING', W / 2, 424, { align: 'center', size: 9, tracking: 2.3, color: C.muted });
}
function render() {
  drawBackground();
  if (game.mode === 'menu') {
    drawHUD();
    drawMenu();
    if (infoOpen) drawInfo();
    return;
  }
  drawWorld();
  drawHUD();
  drawBanner();
  if (game.mode === 'paused') drawPause();
  else if (game.mode === 'gameover') drawGameOver();
  else if (game.mode === 'waveclear') drawWaveClear();
}
/* ---------- main loop ---------- */
syncUI();
let lastFrame = performance.now();
let accumulator = 0;
const STEP = 1 / 120;
function frame(now) {
  const elapsed = Math.min(.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  accumulator += elapsed;
  let steps = 0;
  while (accumulator >= STEP && steps < 10) {
    update(STEP);
    accumulator -= STEP;
    steps++;
  }
  if (steps === 10) accumulator = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('beforeunload', saveHi);
})();
</script>
